name: Pós-jogo — validação final do passo 20 (Real Madrid)
on:
  push:
    branches: [main]
    paths: [.github/workflows/pos-jogo-concluir-passo20.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: pos-jogo-estado-piloto
  cancel-in-progress: false
jobs:
  validar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Executar recuperacao unica e validacao final do passo 20' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Carregar código e controles validados do piloto
        uses: actions/checkout@v4
        with:
          ref: c63010e7fbc4bdcadb5c69f290e949dd047ef601
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /config/
            /prompts/
            /templates/
            /tests/pos-jogo/
            /auditoria/pos-jogo/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar controles do pós-jogo
        run: python -m unittest discover -s tests/pos-jogo -p 'test_*.py'
      - name: Ler destinos atuais do site sem editar
        uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /noticias.json
            /sitemap.xml
            /*.html
      - name: Carregar rotina de recuperação auditável
        uses: actions/checkout@v4
        with:
          ref: main
          path: recovery-code
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/recuperar_real_passo20_final.py
      - name: Recuperar apuração e redação anteriores do Real Madrid
        uses: actions/download-artifact@v4
        with:
          name: pos-jogo-real-recuperacao20-41344947385
          run-id: 41344947385
          github-token: ${{ github.token }}
          path: build/pos-jogo/real-recuperacao20-original
      - name: Rerredigir e validar pacote completo sem publicação
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python recovery-code/scripts/recuperar_real_passo20_final.py
      - name: Disponibilizar pacote e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-jogo-passo20-final-${{ github.run_id }}
          path: build/pos-jogo/passo20-recuperacao-final/
          retention-days: 30
          if-no-files-found: warn
      - name: Verificar integridade do site
        if: always()
        run: |
          git diff --exit-code
          if [ -d current-main/.git ]; then git -C current-main diff --exit-code; fi
