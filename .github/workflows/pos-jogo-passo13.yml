name: Pós-jogo — passo 13 — partida recente até US$ 0,10
on:
  push:
    branches: [piloto-pos-jogo-quatro-clubes]
    paths: [.github/workflows/pos-jogo-passo13.yml]
permissions:
  contents: write
concurrency:
  group: pos-jogo-estado-piloto
  cancel-in-progress: false
jobs:
  testar:
    if: "github.event.head_commit.message == 'Passo 13: validar partida recente'"
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/pos-jogo -p 'test_*.py'
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          persist-credentials: false
      - name: Respeitar espera real e testar uma partida sem publicar
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/testar_partida_recente_pos_jogo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-jogo-passo13-${{ github.run_id }}
          path: build/pos-jogo/passo13/
          retention-days: 7
      - name: Verificar integridade dos arquivos do site
        if: always()
        run: |
          git diff --exit-code
          git -C current-main diff --exit-code
