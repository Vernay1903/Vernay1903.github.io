name: Pré-jogo — auditoria integral gratuita sem publicação # RSS13 #13
on:
  push:
    branches: [main]
    paths: [.github/workflows/pre-jogo-integracao-gratuita-final.yml]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CDE_FREE_RESEARCH: "1"
      CDE_DISABLE_PAID_FACT_FALLBACK: "1"
      CDE_RSS_MAX_REQUESTS: "35"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar regressões sem APIs pagas
        run: |
          set -euo pipefail
          python -m py_compile scripts/pesquisa_publica_gratuita.py scripts/enriquecer_fatos_football_data.py scripts/redigir_pre_jogo_openai.py scripts/recuperar_preparo_pre_jogo_automatico.py
          python tests/pre-jogo/teste_pesquisa_gratuita.py
          python tests/pre-jogo/teste_aliases_adversarios.py
          python tests/pre-jogo/teste_reuso_opcionais.py
          python tests/pre-jogo/teste_estadios_aliases.py
          python tests/pre-jogo/teste_rss_consulta_curta.py
          python tests/pre-jogo/teste_reuso_fontes_gratuitas.py
          python tests/pre-jogo/teste_status_final_football_data.py
          python tests/pre-jogo/teste_enriquecer_fatos_football_data.py
          python tests/pre-jogo/teste_orcamento_openai.py
          python tests/pre-jogo/teste_recuperar_preparo.py
          python tests/pre-jogo/teste_preview_html.py
      - name: Executar pesquisa factual gratuita completa sem redigir nem publicar
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -euo pipefail
          TARGET=$(python -c "from datetime import datetime,timedelta;from zoneinfo import ZoneInfo;print(datetime.now(ZoneInfo('America/Sao_Paulo')).date()+timedelta(days=1))")
          echo "TARGET_DATE=${TARGET}" >> "${GITHUB_ENV}"
          python scripts/buscar_fixtures_football_data.py --date "${TARGET}" --force
          python scripts/identificar_jogos.py --date "${TARGET}" --force
          python scripts/planejar_pre_jogos.py --date "${TARGET}" --force
          python scripts/preparar_dados_editoriais.py --date "${TARGET}" --force
          python scripts/preparar_pesquisa_factual.py --date "${TARGET}" --force
          python scripts/planejar_coleta_fontes.py --date "${TARGET}" --force

          cp config/pre-jogo.json /tmp/pre-jogo.json
          trap 'cp /tmp/pre-jogo.json config/pre-jogo.json' EXIT
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("config/pre-jogo.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          d["research"]["discovery"]["external_search_enabled"]=True
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY

          python scripts/buscar_fontes_serper.py --date "${TARGET}" --execute --force
          python scripts/estruturar_evidencias_candidatas.py --date "${TARGET}" --force
          python scripts/ler_fontes_candidatas.py --date "${TARGET}" --execute --force
          python scripts/extrair_fatos_estruturados.py --date "${TARGET}" --force
          python scripts/enriquecer_fatos_football_data.py --date "${TARGET}" --execute --force
          python scripts/montar_pacote_editorial.py --date "${TARGET}" --force

          cp /tmp/pre-jogo.json config/pre-jogo.json
          trap - EXIT
          git diff --quiet -- config/pre-jogo.json
          python - "${TARGET}" <<'PY'
          import json, sys
          from pathlib import Path
          date=sys.argv[1]
          p=Path("build/pre-jogo")/f"pacotes-editoriais-{date}.json"
          d=json.loads(p.read_text(encoding="utf-8"))
          print("RESULTADO GRATUITO: candidatas=",d["article_count"],"prontas=",d["ready_for_drafting_count"])
          for a in d["articles"]:
              print("CANDIDATO",a["slug"],"pronto=",a["ready_for_drafting"],"pendencias=",a.get("unresolved_required_requirement_ids",[]))
          PY
      - name: Testar redação OpenAI somente de artigos factualmente prontos sem publicar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -euo pipefail
          READY=$(python - <<'PY'
          import json,os
          from pathlib import Path
          t=os.environ['TARGET_DATE']
          m=json.loads((Path('build/pre-jogo')/f'pacotes-editoriais-{t}.json').read_text(encoding='utf-8'))
          print(m['ready_for_drafting_count'])
          PY
          )
          if [ "${READY}" = "0" ]; then
            echo "Nenhuma matéria validada: zero chamada à OpenAI e nenhuma publicação."
            exit 0
          fi
          python scripts/preparar_lote_pre_jogo_automatico.py \
            --date "${TARGET_DATE}" \
            --packages "build/pre-jogo/pacotes-editoriais-${TARGET_DATE}.json" \
            --facts "build/pre-jogo/fatos-estruturados-${TARGET_DATE}.json" \
            --source-main-sha "$(git rev-parse HEAD)" \
            --output-dir build/pre-jogo/automatico --execute --force
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('build/pre-jogo/automatico/manifest.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          print('REDAÇÃO REAL SEM PUBLICAÇÃO: prontas=',d['prepared_count'],'bloqueadas=',d['skipped_count'])
          for row in d['skipped']:
              print('BLOQUEIO:',row['slug'],row['reason'])
          PY
          git diff --quiet -- . ':!build'
          echo "OK: redação real testada sem commit/push e sem Serper."
      - name: Simular janela 00:01 completa sem alterar a main
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -euo pipefail
          MANIFEST="build/pre-jogo/automatico/manifest.json"
          if [ ! -f "${MANIFEST}" ]; then
            echo "Sem lote preparado; nada a simular."
            exit 0
          fi
          APPROVED="build/pre-jogo/auditoria-approved.txt"
          PREVIEWS="build/pre-jogo/auditoria-previews"
          REPORT="build/pre-jogo/auditoria-publicacao.json"
          : > "${APPROVED}"
          rm -rf "${PREVIEWS}"
          mkdir -p "${PREVIEWS}"
          python - <<'PY' > build/pre-jogo/auditoria-status.tsv
          import json
          from pathlib import Path
          data=json.loads(Path('build/pre-jogo/automatico/manifest.json').read_text(encoding='utf-8'))
          for item in data.get('articles',[]):
              print(item['slug']+'\t'+item['status_snapshot'])
          PY
          TAB=$(printf '\t')
          while IFS="${TAB}" read -r SLUG SNAPSHOT; do
            [ -n "${SLUG}" ] || continue
            if python scripts/validar_status_final_pre_jogo.py \
              --evidence "build/pre-jogo/automatico/${SNAPSHOT}" \
              --report "build/pre-jogo/auditoria-status-final-${SLUG%.html}.json" \
              --execute; then
              echo "${SLUG}" >> "${APPROVED}"
            fi
          done < build/pre-jogo/auditoria-status.tsv

          OFFSET=0
          python - <<'PY' > build/pre-jogo/auditoria-preview.tsv
          import json
          from pathlib import Path
          data=json.loads(Path('build/pre-jogo/automatico/manifest.json').read_text(encoding='utf-8'))
          for item in data.get('articles',[]):
              print(item['slug']+'\t'+item['contract']+'\t'+item['draft'])
          PY
          while IFS="${TAB}" read -r SLUG CONTRACT DRAFT; do
            grep -Fxq "${SLUG}" "${APPROVED}" || continue
            python scripts/montar_preview_html_pre_jogo.py \
              --draft "build/pre-jogo/automatico/${DRAFT}" \
              --contract "build/pre-jogo/automatico/${CONTRACT}" \
              --output-dir "${PREVIEWS}" --rotation-offset "${OFFSET}" --force
            OFFSET=$((OFFSET+1))
          done < build/pre-jogo/auditoria-preview.tsv

          python scripts/aplicar_lote_pre_jogo_automatico.py \
            --manifest "${MANIFEST}" \
            --artifact-root build/pre-jogo/automatico \
            --approved "${APPROVED}" \
            --previews-root "${PREVIEWS}" \
            --report "${REPORT}" --dry-run
          git diff --quiet -- . ':!build'
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/pre-jogo/auditoria-publicacao.json').read_text(encoding='utf-8'))
          print('SIMULAÇÃO 00:01: selecionadas=',r['selected_count'],'arquivos que seriam alterados=',r['changed_file_count'])
          print('SIMULAÇÃO 00:01: nenhuma alteração real na main.')
          PY

      - name: Guardar diagnóstico sem matéria publicada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-jogo-integracao-gratuita-final
          path: |
            build/pre-jogo/pacotes-editoriais-*.json
            build/pre-jogo/fatos-estruturados-*.json
            build/pre-jogo/automatico/manifest.json
            build/pre-jogo/redacao-modelo-metadata/*.json
            build/pre-jogo/auditoria-publicacao.json
            build/pre-jogo/auditoria-status-final-*.json
          if-no-files-found: warn
          retention-days: 1
