name: Instagram agenda - previa e conexao

on:
  pull_request:
    paths:
      - 'scripts/instagram/**'
      - 'tests/instagram/**'
      - '.github/workflows/instagram-agenda-preview.yml'
  workflow_dispatch:
    inputs:
      verificar_conexao:
        description: 'Consultar a conta com os secrets (somente leitura, sem publicar)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /agenda.json
            /apple-touch-icon.png
            /scripts/instagram/
            /tests/instagram/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar renderizador isolado
        run: |
          npm install --prefix "$RUNNER_TEMP/cde-story-deps" --no-audit --no-fund playwright@1.58.2
          echo "NODE_PATH=$RUNNER_TEMP/cde-story-deps/node_modules" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/cde-story-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Validar o renderizador
        run: node --test tests/instagram/renderer.test.cjs
      - name: Identificar a data da agenda
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/instagram/provenance.py
      - name: Gerar os Stories sem publicar
        run: node scripts/instagram/render.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: previa-stories-agenda
          path: out/instagram/
          retention-days: 7
          if-no-files-found: error
  verify-account:
    if: github.event_name == 'workflow_dispatch' && inputs.verificar_conexao && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/instagram/
      - name: Consultar somente a identidade da conta
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/instagram/verify_account.py
