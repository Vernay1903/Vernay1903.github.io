name: Pós-jogo — pacote HTML notícia e sitemap
on:
  push:
    branches: [piloto-pos-jogo-quatro-clubes]
    paths: [.github/workflows/pos-jogo-pacote.yml]
permissions:
  contents: read
jobs:
  validar:
    if: "github.event.head_commit.message == 'Passo 10: validar pacote de publicação'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/pos-jogo -p 'test_*.py'
      - name: Gerar pacote de teste com data simulada sem publicar
        run: python scripts/preparar_publicacao_pos_jogo.py --article auditoria/pos-jogo/amostra-editorial-real-leipzig.json --facts auditoria/pos-jogo/fatos-real-leipzig-20261021.json --links auditoria/pos-jogo/links-autorizados-piloto.json --news noticias.json --sitemap sitemap.xml --written-at 2026-10-26T13:00:00-03:00 --site-root . --output build/pos-jogo/pacote-teste
      - run: git diff --exit-code
