name: Pós-jogo — resultados e publicação automática
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Pré-jogo — automático diário (Passo 34)']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths: [.github/workflows/pos-jogo-automatico.yml]
permissions:
  contents: write
  actions: read
  pages: write
concurrency:
  group: pos-jogo-estado-piloto
  cancel-in-progress: false
jobs:
  rascunhos:
    if: ${{ github.event_name != 'push' || github.event.head_commit.message == 'Ativar piloto pos-jogo em modo rascunho' || github.event.head_commit.message == 'Atualizar piloto pos-jogo para prorrogacao e penaltis' || github.event.head_commit.message == 'Ativar verificacao autonoma do passo 16' || github.event.head_commit.message == 'Executar ciclo real do passo 20' || github.event.head_commit.message == 'Corrigir espera e recuperar pos-jogo pendente' || github.event.head_commit.message == 'Validar fontes oficiais nos resultados de novembro' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      POS_JOGO_ARTIFACT_NAME: pos-jogo-rascunhos-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Carregar versão validada do piloto (passo 21)
        uses: actions/checkout@v4
        with:
          ref: e29ac3064113f9e6c8d7e79046f397a534efffc0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /config/
            /prompts/
            /templates/
            /tests/pos-jogo/
            /auditoria/pos-jogo/
            /.gitignore
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar controles do piloto
        run: python -m unittest discover -s tests/pos-jogo -p 'test_*.py'
      - name: Confirmar autorização de publicação e orçamento
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path('config/operacao-pos-jogo.json').read_text())
          scope=json.loads(Path('config/pos-jogo-piloto.json').read_text())
          assert cfg['publication_enabled'] is False
          assert scope['publication_enabled'] is False
          assert cfg['per_article_cap_usd']=='0.10'
          assert cfg['monthly_pilot_cap_usd']=='10.00'
          assert set(scope['monitored_clubs'])=={'Flamengo','Real Madrid','Arsenal','Manchester City'}
          publication=json.loads(Path('config/publicacao-pos-jogo.json').read_text())
          assert publication['enabled'] is True
          assert set(publication['clubs'])==set(scope['monitored_clubs'])
          print('Publicação automática autorizada; preparo isolado, quatro clubes e orçamento protegido')
          PY
      - name: Ler destinos atuais sem modificar o site
        uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /noticias.json
            /sitemap.xml
            /*.html
      - name: Monitorar quatro clubes e preparar rascunhos elegíveis
        id: cycle
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/agendar_pos_jogo.py --site-root current-main --output build/pos-jogo/agendado
      - name: Verificar primeiro rascunho autônomo do passo 16
        if: ${{ always() && steps.cycle.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/validar_passo16_pos_jogo.py --site-root current-main --output build/pos-jogo/agendado
      - name: Recuperar texto curto com apuracao revisada
        id: retomar
        if: ${{ !cancelled() && steps.cycle.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/retomar_extensao_pos_jogo.py
      - name: Publicar resultados aprovados e confirmar acesso no site
        id: publicar
        if: ${{ !cancelled() && steps.cycle.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publicar_pos_jogo.py
      - name: Disponibilizar rascunhos e diagnóstico para revisão
        if: ${{ always() && (failure() || steps.cycle.outputs.has_drafts == 'true' || steps.retomar.outputs.has_drafts == 'true' || steps.publicar.outcome == 'success' || github.event_name != 'schedule') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.POS_JOGO_ARTIFACT_NAME }}
          path: build/pos-jogo/agendado/
          retention-days: 30
          if-no-files-found: warn
      - name: Confirmar integridade dos arquivos
        if: always()
        run: |
          git diff --exit-code
          if [ -d current-main/.git ]; then
            git -C current-main diff --exit-code
          fi
