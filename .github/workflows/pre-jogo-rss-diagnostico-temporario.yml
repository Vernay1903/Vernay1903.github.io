name: Pré-jogo — diagnosticar RSS gratuito sem publicação
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pre-jogo-rss-diagnostico-temporario.yml'
permissions:
  contents: read
jobs:
  rss:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspecionar formato RSS e filtro sem Serper/OpenAI
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0,'.')
          from scripts import pesquisa_publica_gratuita as f
          checks=[
            ('flamengo', 'Flamengo Bragantino 20 setembro 2026', []),
            ('premier', 'Manchester City Sunderland 20 September 2026', []),
            ('atletico', 'Atletico Madrid Real Madrid 20 September 2026', []),
            ('arsenal_oficial', 'Arsenal match preview September 2026', ['arsenal.com']),
            ('brasil_ge', 'Flamengo Bragantino escalações 20 setembro 2026 site:ge.globo.com', ['ge.globo.com']),
            ('brasil_espn', 'Flamengo Bragantino 20 setembro 2026 site:espn.com.br', ['espn.com.br']),
            ('ingles_espn', 'Manchester City Sunderland September 20 2026 site:espn.com', ['espn.com']),
            ('ingles_city', 'Manchester City Sunderland September 20 2026 site:mancity.com', ['mancity.com']),
            ('brasileiro_simples', 'Flamengo RB Bragantino prováveis escalações transmissão', []),
            ('espanhol_simples', 'Atlético Madrid Real Madrid alineaciones 20 septiembre 2026', []),
            ('frances_simples', 'Marseille PSG compositions 20 septembre 2026', []),
          ]
          for label,query,domains in checks:
              url=f.RSS_ENDPOINT+'?'+__import__('urllib.parse',fromlist=['urlencode']).urlencode({'q':query,'format':'rss'})
              try:
                  raw,_=f.fetch(url)
                  items=f._rss_items(raw)
                  decoded=[f.original_link(x.get('link','')) for x in items]
                  selected=[x for x in decoded if x and f.domain_allowed(x,domains)]
                  print(f'RESULTADO {label}: bytes={len(raw)}, prefixo={raw[:85]!r}, itens={len(items)}, url_publica={sum(bool(x) for x in decoded)}, url_filtrada={len(selected)}, amostra={selected[:2]}',flush=True)
              except Exception as e:
                  print(f'ERRO {label}: {type(e).__name__}: {str(e)[:100]}',flush=True)
      - name: Diagnosticar extração de duas páginas públicas originais
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          sys.path.insert(0,'.')
          from scripts.pesquisa_publica_gratuita import read_public_page
          samples=[
            ('Lance Flamengo', 'https://www.lance.com.br/futebol-nacional/flamengo-x-red-bull-bragantino-onde-assistir-horario-e-escalacoes.html'),
            ('Man City oficial', 'https://www.mancity.com/news/mens/city-v-sunderland-match-preview-pl-20-sep-63925242')
          ]
          for label,url in samples:
              try:
                  d=read_public_page(url)
                  content=d['markdown']
                  print(f'LEITURA {label}: caracteres={len(content)} linhas={len(content.splitlines())} título={d["metadata"].get("title","")[:100]}')
                  for term in ('Maracanã', 'Etihad', 'Premiere', 'Prováveis', 'Provavel', 'Rodrigo José'):
                      i=content.casefold().find(term.casefold())
                      print(f'TERMO {term}: encontrado={i>=0} contexto={(content[max(0,i-40):i+95] if i>=0 else "")[:135]}')
              except Exception as e:
                  print(f'LEITURA {label}: erro={type(e).__name__}')
          PY
