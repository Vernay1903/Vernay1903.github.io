name: Pré-jogo — auditoria offline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pre-jogo-auditoria.yml"
      - ".github/workflows/pre-jogo-automatico.yml"
      - "scripts/*pre_jogo*.py"
      - "scripts/enriquecer_fatos_football_data.py"
      - "scripts/buscar_fontes_serper.py"
      - "scripts/ler_fontes_candidatas*.py"
      - "scripts/extrair_fatos_estruturados.py"
      - "scripts/pesquisa_publica_gratuita.py"
      - "config/pre-jogo.json"
      - "config/redacao-pre-jogo.json"
      - "tests/pre-jogo/**"

permissions:
  contents: read

concurrency:
  group: pre-jogo-auditoria-offline
  cancel-in-progress: true

env:
  CDE_FREE_RESEARCH: "1"
  CDE_DISABLE_PAID_FACT_FALLBACK: "1"

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar main sem credencial de push
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar e validar configuração
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py
          python -m json.tool config/pre-jogo.json >/dev/null
          python -m json.tool config/redacao-pre-jogo.json >/dev/null

      - name: Testar pipeline sem rede paga, OpenAI ou publicação
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_dia_sem_jogos.py
          python tests/pre-jogo/teste_recuperar_preparo.py
          python tests/pre-jogo/teste_passo34_automatico.py
          python tests/pre-jogo/teste_passo34_8.py
          python tests/pre-jogo/teste_passo34_9.py
          python tests/pre-jogo/teste_passo34_10.py
          python tests/pre-jogo/teste_passo34_11.py
          python tests/pre-jogo/teste_preview_html.py
          python tests/pre-jogo/teste_redator_openai.py
          python tests/pre-jogo/teste_redacao_controlada.py
          python tests/pre-jogo/teste_pacote_publicacao.py
          python tests/pre-jogo/teste_fluxo_com_jogo_dry_run.py
          python tests/pre-jogo/teste_serper_economia.py
          python tests/pre-jogo/teste_pesquisa_gratuita.py
          python tests/pre-jogo/teste_aliases_adversarios.py
          python tests/pre-jogo/teste_reuso_opcionais.py
          python tests/pre-jogo/teste_estadios_aliases.py
          python tests/pre-jogo/teste_estadio_fixo_mandante.py
          python tests/pre-jogo/teste_modelo_editorial_aprovado.py
          python tests/pre-jogo/teste_profundo_coleta_gratuita.py
          python tests/pre-jogo/teste_rss_consulta_curta.py
          python tests/pre-jogo/teste_reuso_fontes_gratuitas.py
          python tests/pre-jogo/teste_status_final_football_data.py
          python tests/pre-jogo/teste_enriquecer_fatos_football_data.py
          echo "OK: auditoria offline concluída sem OpenAI, Serper ou publicação."
