name: Pré-jogo — auditoria offline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pre-jogo-auditoria.yml"
      - ".github/workflows/pre-jogo-automatico.yml"
      - "scripts/*pre_jogo*.py"
      - "scripts/enriquecer_fatos_football_data.py"
      - "scripts/buscar_fontes_serper.py"
      - "scripts/ler_fontes_candidatas*.py"
      - "scripts/extrair_fatos_estruturados.py"
      - "scripts/pesquisa_publica_gratuita.py"
      - "config/pre-jogo.json"
      - "config/redacao-pre-jogo.json"
      - "tests/pre-jogo/**"

permissions:
  contents: read

concurrency:
  group: pre-jogo-auditoria-offline
  cancel-in-progress: true

env:
  CDE_FREE_RESEARCH: "1"
  CDE_DISABLE_PAID_FACT_FALLBACK: "1"

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar main sem credencial de push
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar e validar configuração
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py
          python -m json.tool config/pre-jogo.json >/dev/null
          python -m json.tool config/redacao-pre-jogo.json >/dev/null

      - name: Testar pipeline sem rede paga, OpenAI ou publicação
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/pre-jogo/teste_*.py; do
            python "$test"
          done
          echo "OK: auditoria offline concluída sem OpenAI, Serper ou publicação."

  verificar-servicos:
    needs: auditar
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conferir serviços reais sem publicar matéria de teste
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/diagnosticar_servicos_pre_jogo.py
      - name: Validar coleta real dos jogos do dia até o pacote editorial
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          CDE_RSS_MAX_REQUESTS: "60"
        run: python scripts/diagnosticar_coleta_pre_jogo.py
      - name: Validar UMA matéria real com OpenAI sem publicar (somente este commit)
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Validacao editorial real (1 artigo)') }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from scripts.qualidade_editorial_pre_jogo import source_depth_errors, facts
          target=(datetime.now(ZoneInfo('America/Sao_Paulo')).date()+timedelta(days=1)).isoformat()
          output=Path('build/pre-jogo')
          manifest=json.loads((output/f'pacotes-editoriais-{target}.json').read_text(encoding='utf-8'))
          ready=[a for a in manifest['articles'] if a['ready_for_drafting'] and not source_depth_errors(a)]
          if not ready:
              raise SystemExit('Nenhuma pauta editorial apta para testar o redator.')
          chosen=max(ready,key=lambda a: sum(k.startswith(('home_team_news_','away_team_news_')) for k in facts(a)))
          slug=Path(chosen['slug']).with_suffix('.json').name
          package=output/f'pacotes-editoriais-{target}'/slug
          assert package.exists()
          (output/'amostra-editorial-package.txt').write_text(str(package), encoding='utf-8')
          (output/'amostra-editorial-slug.txt').write_text(slug, encoding='utf-8')
          print('AMOSTRA REAL SEM PUBLICAÇÃO:', chosen['slug'])
          PY
          python scripts/preparar_redacao_pre_jogo.py \
            --package "$(cat build/pre-jogo/amostra-editorial-package.txt)" --force
          python scripts/redigir_pre_jogo_openai.py \
            --contract "build/pre-jogo/contratos-redacao/$(cat build/pre-jogo/amostra-editorial-slug.txt)" \
            --execute --force
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.qualidade_editorial_pre_jogo import draft_quality_errors
          b=Path('build/pre-jogo')
          slug=(b/'amostra-editorial-slug.txt').read_text().strip()
          draft=json.loads((b/'rascunhos-modelo'/slug).read_text(encoding='utf-8'))
          contract=json.loads((b/'contratos-redacao'/slug).read_text(encoding='utf-8'))
          assert draft.get('draft_validated') is True and draft.get('word_count',0)>=700
          errors=draft_quality_errors(draft.get('body_html',''),contract)
          if errors:
              raise SystemExit('Redação reprovada na qualidade: '+str(errors))
          print('OK: redação factual real de 700+ palavras aprovada sem HTML, commit ou publicação.')
          PY
      - name: Preservar texto integral da amostra para avaliacao editorial
        if: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Validacao editorial real (1 artigo)') }}
        uses: actions/upload-artifact@v4
        with:
          name: materia-amostra-editorial-completa
          path: |
            build/pre-jogo/rascunhos-modelo/*.json
            build/pre-jogo/amostra-editorial-slug.txt
          if-no-files-found: error
          retention-days: 7
      - name: Guardar diagnóstico factual para localizar qualquer bloqueio
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-coleta-real
          path: |
            build/pre-jogo/fatos-estruturados-*.json
            build/pre-jogo/paginas-checadas-*.json
            build/pre-jogo/pacotes-editoriais-*.json
          retention-days: 3
      - name: Provar solicitação e confirmação do Pages existente
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/confirmar_pages_pre_jogo.py --commit "${GITHUB_SHA}"

