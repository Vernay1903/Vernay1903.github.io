name: Pós-jogo — passo 13 — revisão final até US$ 0,10
on:
  push:
    branches: [piloto-pos-jogo-quatro-clubes]
    paths: [.github/workflows/pos-jogo-passo13-aprovacao.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: pos-jogo-estado-piloto
  cancel-in-progress: false
jobs:
  testar:
    if: "github.event.head_commit.message == 'Passo 13: finalizar revisao e conferir pacote'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests/pos-jogo -p 'test_*.py'
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pos-jogo-passo13-conclusao-40577346518
          run-id: 40577346518
          github-token: ${{ github.token }}
          path: build/pos-jogo/passo13-completo-anterior
      - name: Retomar redação com apuração revisada e saldo preservado
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/finalizar_revisao_passo13_pos_jogo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-jogo-passo13-aprovacao-${{ github.run_id }}
          path: build/pos-jogo/passo13-aprovacao/
          retention-days: 7
      - name: Verificar integridade dos arquivos do site
        if: always()
        run: |
          git diff --exit-code
          git -C current-main diff --exit-code
# Reexecução após tornar o teste independente da existência prévia de build.
