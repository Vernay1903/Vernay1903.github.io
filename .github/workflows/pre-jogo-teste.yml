name: Pré-jogo — teste manual

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Data-alvo YYYY-MM-DD (vazio = amanhã em America/Sao_Paulo)"
        required: false
        type: string
      mode:
        description: "Modo do teste"
        required: true
        default: simulation_only
        type: choice
        options:
          - simulation_only
          - serper_smoke_test
          - real_api

permissions:
  contents: read

concurrency:
  group: pre-jogo-teste-manual
  cancel-in-progress: false

jobs:
  validar-e-testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar arquivos e sintaxe
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/pre-jogo.json > /dev/null
          python -m json.tool tests/pre-jogo/football-data-resposta-simulada.json > /dev/null
          python -m json.tool tests/pre-jogo/evidencias-pesquisa-simuladas.json > /dev/null
          python -m json.tool tests/pre-jogo/serper-resposta-simulada.json > /dev/null
          python -m py_compile \
            scripts/buscar_fixtures_football_data.py \
            scripts/identificar_jogos.py \
            scripts/planejar_pre_jogos.py \
            scripts/preparar_dados_editoriais.py \
            scripts/preparar_pesquisa_factual.py \
            scripts/validar_pesquisa_factual.py \
            scripts/planejar_coleta_fontes.py \
            scripts/buscar_fontes_serper.py \
            scripts/testar_serper_real.py \
            scripts/gerar_pre_jogo.py \
            tests/pre-jogo/teste_pipeline_simulado.py \
            tests/pre-jogo/teste_validacao_pesquisa.py \
            tests/pre-jogo/teste_planejamento_coleta.py \
            tests/pre-jogo/teste_serper_provider.py
          test -f templates/pre-jogo.html
          test -f templates/imagens/01-bola-uhlsport.html
          test -f templates/imagens/02-bola-adidas.html
          test -f templates/imagens/03-bola-estadio.html
          echo "Estrutura técnica validada."

      - name: Executar pipeline simulado sem API
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_pipeline_simulado.py

      - name: Validar evidências factuais simuladas
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_validacao_pesquisa.py

      - name: Validar planejamento de coleta de fontes
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_planejamento_coleta.py

      - name: Validar integração Serper sem chamada externa
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_serper_provider.py

      - name: Guardar relatórios dos testes simulados
        uses: actions/upload-artifact@v4
        with:
          name: pre-jogo-simulacao
          path: |
            build/pre-jogo/teste-simulado.json
            build/pre-jogo/teste-validacao-pesquisa.json
            build/pre-jogo/teste-planejamento-coleta.json
            build/pre-jogo/teste-serper-provider.json
          if-no-files-found: error
          retention-days: 3

      - name: Definir data-alvo
        id: date
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.target_date }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_DATE}" ]; then
            if ! [[ "${INPUT_DATE}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Data inválida. Use YYYY-MM-DD."
              exit 1
            fi
            TARGET_DATE="${INPUT_DATE}"
          else
            TARGET_DATE="$(TZ=America/Sao_Paulo date -d tomorrow +%F)"
          fi
          echo "target_date=${TARGET_DATE}" >> "$GITHUB_OUTPUT"
          echo "Data-alvo: ${TARGET_DATE}"

      - name: Modo seguro sem chamada externa
        if: ${{ inputs.mode == 'simulation_only' }}
        shell: bash
        run: |
          echo "Pipeline simulado, validação factual, planejamento de fontes e integração Serper concluídos."
          echo "A API football-data.org NÃO foi consultada."
          echo "O Serper foi selecionado e validado apenas com resposta simulada."
          echo "Nenhuma pesquisa externa real foi executada."
          echo "HTML e publicação permaneceram bloqueados."
          echo "Nenhum arquivo publicado foi alterado."

      - name: Verificar Secret do Serper
        if: ${{ inputs.mode == 'serper_smoke_test' }}
        shell: bash
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERPER_API_KEY}" ]; then
            echo "O Secret SERPER_API_KEY não está configurado."
            exit 1
          fi
          echo "SERPER_API_KEY encontrado. O valor não será exibido."

      - name: Executar uma única consulta real ao Serper
        if: ${{ inputs.mode == 'serper_smoke_test' }}
        shell: bash
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/testar_serper_real.py --execute --force

      - name: Guardar resultado do smoke test Serper
        if: ${{ inputs.mode == 'serper_smoke_test' }}
        uses: actions/upload-artifact@v4
        with:
          name: serper-smoke-test
          path: build/pre-jogo/serper-smoke-test.json
          if-no-files-found: error
          retention-days: 3

      - name: Resumo do smoke test Serper
        if: ${{ inputs.mode == 'serper_smoke_test' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("build/pre-jogo/serper-smoke-test.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          print(f"Provedor: {data['provider']}")
          print(f"Consultas reais executadas: {data['query_count']}")
          print(f"Candidatos oficiais encontrados: {data['candidate_count']}")
          print("Fatos verificados: não")
          print("Redação liberada: não")
          print("HTML liberado: não")
          print("Publicação liberada: não")
          PY

      - name: Verificar Secret para teste real
        if: ${{ inputs.mode == 'real_api' }}
        shell: bash
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${FOOTBALL_DATA_TOKEN}" ]; then
            echo "O Secret FOOTBALL_DATA_TOKEN ainda não está configurado."
            exit 1
          fi
          echo "Secret encontrado. O valor não será exibido."

      - name: Buscar fixtures no football-data.org
        if: ${{ inputs.mode == 'real_api' }}
        shell: bash
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/buscar_fixtures_football_data.py \
            --date "${{ steps.date.outputs.target_date }}" \
            --force

      - name: Identificar jogos monitorados
        if: ${{ inputs.mode == 'real_api' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/identificar_jogos.py \
            --date "${{ steps.date.outputs.target_date }}" \
            --force

      - name: Planejar matérias sem publicar
        if: ${{ inputs.mode == 'real_api' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/planejar_pre_jogos.py \
            --date "${{ steps.date.outputs.target_date }}" \
            --force

      - name: Preparar dados editoriais sem redigir
        if: ${{ inputs.mode == 'real_api' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preparar_dados_editoriais.py \
            --date "${{ steps.date.outputs.target_date }}" \
            --force

      - name: Preparar dossiês de pesquisa factual
        if: ${{ inputs.mode == 'real_api' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preparar_pesquisa_factual.py \
            --date "${{ steps.date.outputs.target_date }}" \
            --force

      - name: Planejar coleta de fontes sem pesquisar
        if: ${{ inputs.mode == 'real_api' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/planejar_coleta_fontes.py \
            --date "${{ steps.date.outputs.target_date }}" \
            --force

      - name: Mostrar resumo do teste real
        if: ${{ inputs.mode == 'real_api' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          target = "${{ steps.date.outputs.target_date }}"
          games_path = Path(f"build/pre-jogo/jogos-{target}.json")
          plans_path = Path(f"build/pre-jogo/planos-{target}.json")
          editorial_path = Path(f"build/pre-jogo/dados-editoriais-{target}.json")
          research_path = Path(f"build/pre-jogo/pesquisa-{target}.json")
          collection_path = Path(f"build/pre-jogo/coleta-fontes-{target}.json")
          games = json.loads(games_path.read_text(encoding="utf-8"))
          plans = json.loads(plans_path.read_text(encoding="utf-8"))
          editorial = json.loads(editorial_path.read_text(encoding="utf-8"))
          research = json.loads(research_path.read_text(encoding="utf-8"))
          collection = json.loads(collection_path.read_text(encoding="utf-8"))
          provider = collection['search_provider']
          provider_name = provider.get('name') if isinstance(provider, dict) else provider
          print(f"Data-alvo: {games['target_date']}")
          print(f"Partidas recebidas: {games['input_count']}")
          print(f"Partidas selecionadas: {games['selected_count']}")
          print(f"Matérias candidatas: {plans['planned_count']}")
          print(f"Matérias bloqueadas: {plans['skipped_count']}")
          print(f"Dados editoriais preparados: {editorial['editorial_count']}")
          print(f"Dossiês de pesquisa preparados: {research['research_dossier_count']}")
          print(f"Planos de coleta preparados: {collection['collection_plan_count']}")
          print(f"Pesquisa externa executada: {collection['external_search_performed']}")
          print(f"Provedor de busca selecionado: {provider_name}")
          print("A busca Serper real do pipeline continua separada e bloqueada até uma etapa posterior.")
          print("HTML e publicação continuam bloqueados.")
          for item in collection["plans"]:
              print(
                  f"- COLETA PLANEJADA | {item['title']} | "
                  f"{len(item['tasks'])} tarefas"
              )
          for item in plans["skipped"]:
              print(
                  f"- BLOQUEADO | {item['home']} x {item['away']} | "
                  f"{', '.join(item['reasons'])}"
              )
          PY

      - name: Guardar relatório do teste real como artifact
        if: ${{ inputs.mode == 'real_api' }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-jogo-teste-${{ steps.date.outputs.target_date }}
          path: |
            build/pre-jogo/fixtures-normalizados.json
            build/pre-jogo/jogos-${{ steps.date.outputs.target_date }}.json
            build/pre-jogo/planos-${{ steps.date.outputs.target_date }}.json
            build/pre-jogo/dados-editoriais-${{ steps.date.outputs.target_date }}.json
            build/pre-jogo/dados-editoriais-${{ steps.date.outputs.target_date }}/
            build/pre-jogo/pesquisa-${{ steps.date.outputs.target_date }}.json
            build/pre-jogo/pesquisa-${{ steps.date.outputs.target_date }}/
            build/pre-jogo/coleta-fontes-${{ steps.date.outputs.target_date }}.json
            build/pre-jogo/coleta-fontes-${{ steps.date.outputs.target_date }}/
          if-no-files-found: error
          retention-days: 3

      - name: Confirmar que nada foi publicado
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':!build'; then
            echo "ERRO: o teste alterou arquivos versionados."
            git diff -- . ':!build'
            exit 1
          fi
          echo "OK: nenhum arquivo versionado/publicado foi alterado."
