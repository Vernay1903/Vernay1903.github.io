name: Pré-jogo — teste real de fontes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-jogo-serper-discovery
  cancel-in-progress: false

jobs:
  testar-hierarquia-fontes:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar estrutura do teste
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool config/pre-jogo.json > /dev/null
          python -m py_compile \
            scripts/buscar_fontes_serper.py \
            scripts/preparar_pesquisa_factual.py \
            scripts/estruturar_evidencias_candidatas.py \
            scripts/ler_fontes_candidatas.py \
            scripts/extrair_fatos_estruturados.py \
            scripts/validar_politica_editorial.py \
            scripts/testar_descoberta_fontes_real.py \
            tests/pre-jogo/teste_estruturacao_evidencias.py \
            tests/pre-jogo/teste_leitura_fontes.py \
            tests/pre-jogo/teste_extracao_fatos.py \
            tests/pre-jogo/teste_extratores_multicampos.py
          echo "Estrutura de descoberta, leitura, extração factual e política editorial validada."

      - name: Validar estruturação de evidências sem internet
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_estruturacao_evidencias.py

      - name: Validar leitura de fontes sem internet
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_leitura_fontes.py

      - name: Validar extração factual e conflitos sem internet
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_extracao_fatos.py

      - name: Validar extratores factuais multicampos
        shell: bash
        run: |
          set -euo pipefail
          python tests/pre-jogo/teste_extratores_multicampos.py

      - name: Verificar Secret do Serper
        shell: bash
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERPER_API_KEY}" ]; then
            echo "O Secret SERPER_API_KEY não está configurado."
            exit 1
          fi
          echo "SERPER_API_KEY encontrado. O valor não será exibido."

      - name: Executar descoberta, leitura e extração real controlada
        shell: bash
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/testar_descoberta_fontes_real.py --execute --force

      - name: Resumo da descoberta, leitura e extração factual
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("build/pre-jogo/serper-discovery-test.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          structured = data["structured_evidence_candidate"]
          checked = data["checked_requirement"]
          extracted = data["extracted_requirement"]
          multi = json.loads(Path("build/pre-jogo/teste-extratores-multicampos.json").read_text(encoding="utf-8"))
          print(f"Provedor de busca: {data['provider']}")
          print(f"Leitor de páginas: {data['page_reader']}")
          print(f"Consultas reais executadas: {data['query_count']}")
          print("Prioridade: " + " -> ".join(data['source_priority']))
          print(f"Primeira etapa com candidatos: {data['selected_source_type']}")
          print(f"Candidatos encontrados: {data['candidate_count']}")
          print(f"Hierarquia respeitada: {data['hierarchy_respected']}")
          print(f"Requisito ligado ao dossiê no teste real: {data['requirement_id']}")
          print(f"Fontes candidatas estruturadas: {structured['candidate_source_count']}")
          print(f"Tentativas de leitura: {data['page_check_attempt_count']}")
          print(f"Páginas lidas com conteúdo: {data['page_check_success_count']}")
          print(f"Fontes elegíveis para extração factual: {data['eligible_source_count']}")
          print(f"Fatos estruturados aceitos no teste real: {data['structured_fact_count']}")
          print(f"Conflito detectado no teste real: {data['conflict_detected']}")
          print(f"Validador factual aceitou o requisito real: {data['validator_accepted']}")
          print(f"Status de extração real: {extracted.get('fact_extraction_status')}")
          print(f"Status do requisito após leitura: {checked['status']}")
          print("Extratores determinísticos habilitados: " + ", ".join(multi['enabled_extractors']))
          print(f"Conflito de transmissão bloqueado: {multi['conflict_case_blocked']}")
          print(f"Escalação incompleta bloqueada: {multi['incomplete_lineup_blocked']}")
          print(f"H2H inconsistente bloqueado: {multi['inconsistent_h2h_blocked']}")
          print("Fontes/consultas podem aparecer na matéria: não")
          print("Redação liberada: não")
          print("HTML liberado: não")
          print("Publicação liberada: não")
          PY

      - name: Guardar resultado do teste real de fontes
        uses: actions/upload-artifact@v4
        with:
          name: serper-discovery-test
          path: |
            build/pre-jogo/serper-discovery-test.json
            build/pre-jogo/teste-estruturacao-evidencias.json
            build/pre-jogo/teste-leitura-fontes.json
            build/pre-jogo/teste-extracao-fatos.json
            build/pre-jogo/teste-extratores-multicampos.json
          if-no-files-found: error
          retention-days: 3

      - name: Confirmar que nada foi publicado
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- . ':!build'; then
            echo "ERRO: o teste alterou arquivos versionados."
            git diff -- . ':!build'
            exit 1
          fi
          echo "OK: nenhum arquivo versionado/publicado foi alterado."
