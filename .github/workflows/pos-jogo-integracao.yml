name: Pós-jogo — integração dos quatro clubes
on:
  push:
    branches: [piloto-pos-jogo-quatro-clubes]
    paths: [.github/workflows/pos-jogo-integracao.yml]
permissions:
  contents: read
concurrency:
  group: pos-jogo-integracao
  cancel-in-progress: false
jobs:
  integrar:
    if: "github.event.head_commit.message == 'Passo 7: testar integração da coleta e redação'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar integração e bloqueios
        run: python -m unittest discover -s tests/pos-jogo -p 'test_*.py'
      - name: Obter notícias atuais para evitar duplicatas
        uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          sparse-checkout: noticias.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Coletar jogos do dia sem gerar matéria
        run: python scripts/executar_pos_jogo.py --date 2026-10-22 --noticias current-main/noticias.json --output-dir build/pos-jogo/integracao-hoje
      - name: Coletar jogo encerrado e redigir com revisão
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/executar_pos_jogo.py --date 2026-10-21 --noticias current-main/noticias.json --output-dir build/pos-jogo/integracao-encerrado --execute
      - name: Guardar resultado da integração
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-jogo-integracao-${{ github.run_id }}
          path: |
            build/pos-jogo/integracao-hoje/
            build/pos-jogo/integracao-encerrado/
          retention-days: 7
          if-no-files-found: warn
      - name: Conferir que arquivos do site não foram modificados
        if: always()
        run: git diff --exit-code
