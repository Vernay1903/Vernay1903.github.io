name: Pós-jogo — testes de integração do passo 21
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pos-jogo-passo21-testes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste-passo21:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Executar testes isolados do passo 21' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Carregar branch isolada do pós-jogo
        uses: actions/checkout@v4
        with:
          ref: piloto-pos-jogo-passo21
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe sem chamadas de API
        run: |
          python -m py_compile scripts/agendar_pos_jogo.py scripts/operar_pos_jogo.py scripts/executar_pos_jogo.py tests/pos-jogo/test_passo21.py
      - name: Rodar toda a suíte do pós-jogo
        run: python -m unittest discover -s tests/pos-jogo -p 'test_*.py' -v
      - name: Confirmar publicação desativada e orçamento intacto
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config=json.loads(Path('config/operacao-pos-jogo.json').read_text())
          scope=json.loads(Path('config/pos-jogo-piloto.json').read_text())
          assert config['publication_enabled'] is False
          assert scope['publication_enabled'] is False
          assert config['per_article_cap_usd']=='0.10'
          assert config['monthly_pilot_cap_usd']=='10.00'
          assert set(scope['monitored_clubs'])=={'Flamengo','Real Madrid','Arsenal','Manchester City'}
          print('Proteções do piloto confirmadas; nenhuma API paga ou publicação acionada.')
          PY
