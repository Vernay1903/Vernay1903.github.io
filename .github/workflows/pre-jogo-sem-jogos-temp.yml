name: Pré-jogo — prova real de dia sem jogos temporária
on:
  push:
    branches: [main]
    paths: [.github/workflows/pre-jogo-sem-jogos-temp.yml]
permissions:
  contents: read
jobs:
  dia-vazio:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      CDE_FREE_RESEARCH: "1"
      CDE_DISABLE_PAID_FACT_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar Football-Data e simular preparo vazio sem OpenAI
        run: |
          set -euo pipefail
          TARGET_DATE=2026-09-22
          python scripts/buscar_fixtures_football_data.py --date "${TARGET_DATE}" --force
          python scripts/identificar_jogos.py --date "${TARGET_DATE}" --force
          python scripts/planejar_pre_jogos.py --date "${TARGET_DATE}" --force
          python - <<'PY'
          import json
          from pathlib import Path
          date="2026-09-22"
          games=json.loads(Path(f'build/pre-jogo/jogos-{date}.json').read_text(encoding='utf-8'))
          plans=json.loads(Path(f'build/pre-jogo/planos-{date}.json').read_text(encoding='utf-8'))
          print("DIA REAL",date,"recebidas",games["input_count"],
                "dos clubes",games["selected_count"],
                "planejadas",plans["planned_count"],
                "não planejadas",plans["skipped_count"])
          if games['selected_count'] != 0:
              print("Há jogo elegível; prova de dia vazio não se aplica à data consultada.")
              raise SystemExit(42)
          PY
          python scripts/registrar_preparo_vazio_pre_jogo.py --date "${TARGET_DATE}" \
            --source-main-sha "$(git rev-parse HEAD)" --force
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('build/pre-jogo/automatico/manifest.json').read_text())
          assert m['no_eligible_matches'] and m['prepared_count']==0
          assert m['skipped_count']==0 and m['articles']==[]
          assert m['publication_unlocked'] is False
          print("OK: lote vazio real gerado sem redator e sem publicação.")
          PY
          git diff --quiet -- . ':!build'
          if git status --porcelain=v1 --untracked-files=all | grep -v '^?? build/' | grep -q .; then
            echo 'ERRO: arquivo fora de build foi alterado'
            exit 1
          fi
          echo 'OK: nenhuma alteração no site nem na agenda.'
