name: Publicar agenda validada

on:
  workflow_run:
    workflows: ["Agenda Guard"]
    types: [completed]
  schedule:
    - cron: "1,17,37,57 3 * * *"
    - cron: "17,47 4-6 * * *"
  workflow_dispatch:
    inputs:
      verificar_credencial:
        description: 'Verificar somente a credencial, sem publicar'
        type: boolean
        default: false

      simular:
        description: 'Coletar e validar sem alterar agenda ou criar PR'
        type: boolean
        default: false
      data_teste:
        description: 'Data YYYY-MM-DD: somente com simular marcado'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: publicar-agenda-main
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'agenda-auto-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Coletar as 13 competições e validar a data de Brasília
        if: ${{ inputs.verificar_credencial != true }}
        env:
          SIMULAR: ${{ inputs.simular }}
          DATA_TESTE: ${{ inputs.data_teste }}
        shell: bash
        run: |
          python - <<'PY'
          import concurrent.futures
          import datetime as dt
          import json
          import os
          import re
          import time
          import urllib.request
          from zoneinfo import ZoneInfo

          TZ = ZoneInfo('America/Sao_Paulo')
          LEAGUES = [
              ('esp.1', '740', 'La Liga'),
              ('eng.1', '700', 'Premier League'),
              ('ger.1', '720', 'Bundesliga'),
              ('fra.1', '710', 'Ligue 1'),
              ('ita.1', '730', 'Serie A italiana'),
              ('uefa.champions', '775', 'UEFA Champions League'),
              ('uefa.europa', '776', 'UEFA Europa League'),
              ('uefa.nations', '2395', 'Liga das Nações'),
              ('bra.copa_do_brazil', None, 'Copa do Brasil'),
              ('conmebol.libertadores', '783', 'Copa Libertadores'),
              ('conmebol.sudamericana', '5454', 'Copa Sul-Americana'),
              ('bra.1', '630', 'Brasileirão Série A'),
              ('bra.2', '4007', 'Brasileirão Série B'),
          ]

          def download(slug, day):
              url = ('https://site.api.espn.com/apis/site/v2/sports/soccer/' + slug
                     + '/scoreboard?dates=' + day.strftime('%Y%m%d') + '&limit=1000&lang=pt&region=br')
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(url, headers={'User-Agent': 'CorteDosEsportes-Agenda/1.0', 'Accept': 'application/json'})
                      with urllib.request.urlopen(request, timeout=25) as response:
                          if response.status != 200:
                              raise ValueError('HTTP ' + str(response.status))
                          data = json.load(response)
                      return data, url
                  except Exception as error:
                      if attempt == 2:
                          raise RuntimeError(f'Coleta incompleta: {slug} {day}: {error}') from error
                      time.sleep(2 ** attempt)

          def parse(data, slug, league_id, name, target):
              leagues = data.get('leagues') if isinstance(data, dict) else None
              if not isinstance(leagues, list) or len(leagues) != 1 or leagues[0].get('slug') != slug:
                  raise ValueError(f'Competição ausente/incorreta na resposta: {slug}')
              if league_id and str(leagues[0].get('id')) != league_id:
                  raise ValueError(f'ID de competição incorreto: {slug}')
              events = data.get('events')
              if not isinstance(events, list) or len(events) >= 1000:
                  raise ValueError(f'Lista de jogos ausente/truncada: {slug}')
              result = {}
              for event in events:
                  event_id = event.get('id')
                  raw_date = event.get('date', '')
                  if not event_id or not re.search(r'(Z|[+-]\d{2}:\d{2})$', raw_date):
                      raise ValueError(f'Jogo sem ID ou data com fuso: {slug}')
                  start = dt.datetime.fromisoformat(raw_date.replace('Z', '+00:00')).astimezone(TZ)
                  if start.date() != target:
                      continue
                  competitions = event.get('competitions')
                  if not isinstance(competitions, list) or len(competitions) != 1:
                      raise ValueError(f'Partida inválida: {event_id}')
                  match = competitions[0]
                  status = event.get('status', match.get('status', {})).get('type', {})
                  if status.get('name') in ('STATUS_POSTPONED', 'STATUS_CANCELED', 'STATUS_CANCELLED'):
                      continue
                  if status.get('state') not in ('pre', 'in', 'post') or status.get('name') in ('STATUS_DELAYED', 'STATUS_SUSPENDED', 'STATUS_TBD') or match.get('dateValid') is False or match.get('timeValid') is False:
                      raise ValueError(f'Horário/status indefinido: {event_id}; agenda preservada')
                  teams = match.get('competitors', [])
                  if len(teams) != 2 or {team.get('homeAway') for team in teams} != {'home', 'away'}:
                      raise ValueError(f'Mandante/visitante inválido: {event_id}')
                  names = {}
                  for team in teams:
                      text = team.get('team', {}).get('displayName', '').strip()
                      if not text or text.lower() in ('tbd', 'a definir', 'winner', 'loser'):
                          raise ValueError(f'Equipe indefinida: {event_id}')
                      names[team['homeAway']] = text
                  entry = {'time': start.strftime('%H:%M'), 'desc': names['home'] + ' x ' + names['away'] + ' - ' + name}
                  key = slug + ':' + str(event_id)
                  if key in result and result[key] != entry:
                      raise ValueError(f'Jogo divergente: {key}')
                  result[key] = entry
              return result

          def collect(target, loader=download):
              # Consultar também o dia UTC seguinte cobre jogos brasileiros após 21h.
              days = (target, target + dt.timedelta(days=1))
              def league_job(league):
                  slug, league_id, name = league
                  games, sources = {}, []
                  for day in days:
                      data, url = loader(slug, day)
                      entries = parse(data, slug, league_id, name, target)
                      for key, value in entries.items():
                          if key in games and games[key] != value:
                              raise ValueError(f'Horário/equipes divergentes entre consultas: {key}')
                          games[key] = value
                      sources.append(url)
                  return games, {'competition': name, 'count': len(games), 'sources': sources}
              with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
                  results = list(pool.map(league_job, LEAGUES))
              games, coverage = {}, []
              for entries, evidence in results:
                  games.update(entries)
                  coverage.append(evidence)
              agenda = sorted(games.values(), key=lambda item: (item['time'], item['desc']))
              if len({(item['time'], item['desc']) for item in agenda}) != len(agenda):
                  raise ValueError('Jogos duplicados com IDs diferentes; agenda preservada')
              if len(coverage) != 13:
                  raise ValueError('Cobertura incompleta; agenda preservada')
              return {'date': target.isoformat(), 'agenda': agenda, 'coverage': coverage}

          if __name__ == '__main__':
              today = dt.datetime.now(TZ).date()
              requested = os.environ.get('DATA_TESTE', '').strip()
              if requested and os.environ.get('SIMULAR') != 'true':
                  raise SystemExit('Data alternativa permitida somente em simulação sem escrita.')
              target = dt.date.fromisoformat(requested) if requested else today
              result = collect(target)
              if not requested and dt.datetime.now(TZ).date() != target:
                  raise SystemExit('A data mudou durante a coleta; tentar novamente.')
              path = os.path.join(os.environ.get('RUNNER_TEMP', '/tmp'), 'agenda-coleta.json')
              with open(path, 'w', encoding='utf-8') as file:
                  json.dump(result, file, ensure_ascii=False, indent=2)
              print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Conferir PR, Agenda Guard e publicar sem bypass
        uses: actions/github-script@v9
        env:
          AGENDA_PR_TOKEN: ${{ secrets.AGENDA_PR_TOKEN }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoName = owner + '/' + repo;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            // Use um cliente separado: o hook do cliente padrão sobrescreve
            // Authorization com GITHUB_TOKEN mesmo quando o header é informado.
            let recoveryClient;
            function prClient() {
              if (!process.env.AGENDA_PR_TOKEN) {
                throw new Error('Secret AGENDA_PR_TOKEN ausente; recuperação de PR indisponível.');
              }
              if (!recoveryClient) recoveryClient = getOctokit(process.env.AGENDA_PR_TOKEN);
              return recoveryClient;
            }

            // Permite testar a credencial sem criar alteração artificial na agenda.
            if (context.eventName === 'workflow_dispatch') {
              const identity = (await prClient().rest.users.getAuthenticated()).data;
              if (identity.login.toLowerCase() !== owner.toLowerCase()) {
                throw new Error('AGENDA_PR_TOKEN não pertence ao proprietário esperado do repositório.');
              }
              await prClient().rest.repos.get({ owner, repo });
              core.notice('AGENDA_PR_TOKEN autenticado como ' + identity.login + '; acesso ao repositório confirmado.');
              if (context.payload.inputs?.verificar_credencial === 'true') return;
            }

            function saoParts() {
              const p = Object.fromEntries(
                new Intl.DateTimeFormat('en-US', {
                  timeZone: 'America/Sao_Paulo',
                  year: 'numeric', month: '2-digit', day: '2-digit',
                  hour: '2-digit', minute: '2-digit', second: '2-digit',
                  hourCycle: 'h23'
                }).formatToParts(new Date()).map(({type, value}) => [type, value])
              );
              return {
                date: p.year + '-' + p.month + '-' + p.day,
                hour: Number(p.hour),
                minute: Number(p.minute),
                second: Number(p.second)
              };
            }

            function addDays(date, days) {
              const [y, m, d] = date.split('-').map(Number);
              const dt = new Date(Date.UTC(y, m - 1, d + days));
              return dt.toISOString().slice(0, 10);
            }

            function canonicalAgenda(value) {
              if (!Array.isArray(value)) return null;
              let previous = '';
              const seen = new Set();
              for (const item of value) {
                if (!item || typeof item !== 'object' || Array.isArray(item) ||
                    Object.keys(item).sort().join(',') !== 'desc,time' ||
                    typeof item.time !== 'string' || !/^(?:[01][0-9]|2[0-3]):[0-5][0-9]$/.test(item.time) ||
                    typeof item.desc !== 'string' || !item.desc.includes(' x ') || !item.desc.includes(' - ') ||
                    item.time < previous || seen.has(item.time + '|' + item.desc)) return null;
                previous = item.time;
                seen.add(item.time + '|' + item.desc);
              }
              return JSON.stringify(value.map(entry => ({
                time: entry && entry.time,
                desc: entry && typeof entry.desc === 'string' ? entry.desc
                  .replace(/\bPaíses Baixos\b/g, 'Holanda')
                  .replace(/\bAthletic-MG\b/g, 'Athletic') : entry && entry.desc
              })).sort((a, b) => String(a.time).localeCompare(String(b.time)) || String(a.desc).localeCompare(String(b.desc))));
            }

            let local = saoParts();
            let date = local.date;
            let branch = 'agenda-auto-' + date;
            let triggeringGuard = null;

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              const match = /^agenda-auto-(\d{4}-\d{2}-\d{2})$/.exec(run.head_branch || '');

              if (run.event !== 'pull_request' || !match) {
                core.info('Evento não pertence a uma branch automática válida. Nada a publicar.');
                return;
              }

              date = match[1];
              branch = run.head_branch;
              triggeringGuard = run;

              // O agendador pode disparar a tarefa das 00:01 alguns minutos antes.
              // Se a branch já for do dia seguinte e faltarem no máximo 10 minutos
              // para a meia-noite em Brasília, espere a virada antes de publicar.
              if (date !== local.date) {
                const tomorrow = addDays(local.date, 1);
                if (date === tomorrow && local.hour === 23 && local.minute >= 50) {
                  const waitMs = (((60 - local.minute) * 60) - local.second) * 1000 + 5000;
                  if (waitMs <= 10 * 60 * 1000) {
                    core.info('Branch do próximo dia criada antes da meia-noite; aguardando a virada em Brasília.');
                    await sleep(waitMs);
                    local = saoParts();
                  }
                }

                if (date !== local.date) {
                  core.info('Branch ' + branch + ' não corresponde à data atual em Brasília. Nada a publicar.');
                  return;
                }
              }
            }

            // O mesmo workflow coleta os jogos: não depende da preparação pelo ChatGPT.
            const fs = require('node:fs');
            const collection = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/agenda-coleta.json', 'utf8'));
            const simulation = context.eventName === 'workflow_dispatch' && context.payload.inputs?.simular === 'true';
            if (!Array.isArray(collection.coverage) || collection.coverage.length !== 13 || !Array.isArray(collection.agenda)) {
              throw new Error('Coleta ausente ou incompleta; nenhuma alteração permitida.');
            }
            const collected = collection.agenda;
            await core.summary.addHeading('Agenda de ' + collection.date)
              .addRaw('Coleta ESPN: 13 competições confirmadas. ' + collected.length + ' jogo(s).\n')
              .addTable([
                [{data: 'Competição', header: true}, {data: 'Jogos', header: true}],
                ...collection.coverage.map(row => [row.competition, String(row.count)])
              ]).addCodeBlock(JSON.stringify(collected, null, 2), 'json').write();
            if (simulation) {
              core.notice('SIMULAÇÃO: coleta e validação concluídas; nenhuma branch, PR ou agenda alterada.');
              return;
            }
            if (collection.date !== date || saoParts().date !== date) {
              throw new Error('Data da coleta não corresponde ao dia atual em Brasília.');
            }
            const mainSnapshot = (await github.rest.repos.getBranch({owner, repo, branch: 'main'})).data.commit.sha;
            const mainSource = (await github.rest.repos.getContent({owner, repo, path: 'agenda.json', ref: mainSnapshot})).data;
            if (Array.isArray(mainSource)) throw new Error('agenda.json não é arquivo.');
            let currentAgenda = null;
            try { currentAgenda = JSON.parse(Buffer.from(mainSource.content, 'base64').toString('utf8')); } catch {}
            if (canonicalAgenda(currentAgenda) === canonicalAgenda(collected)) {
              core.notice('Agenda de ' + date + ' conferida nas 13 competições, sem alteração: ' + collected.length + ' jogo(s).');
              await core.summary.addRaw('\nResultado: agenda conferida, sem alteração.\n').write();
              return;
            }

            async function prepareDailyBranch() {
              // Nunca atualiza main: toda escrita de conteúdo fica na branch diária.
              let ref;
              try {
                ref = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch})).data;
              } catch (error) {
                if (error.status !== 404) throw error;
                ref = (await github.rest.git.createRef({owner, repo, ref: 'refs/heads/' + branch, sha: mainSnapshot})).data;
              }
              const head = ref.object.sha;
              const comparison = (await github.rest.repos.compareCommits({owner, repo, base: mainSnapshot, head})).data;
              if ((comparison.files || []).some(file => file.filename !== 'agenda.json')) {
                throw new Error('Branch diária contém alteração fora de agenda.json; escrita recusada.');
              }
              const mainCommit = (await github.rest.git.getCommit({owner, repo, commit_sha: mainSnapshot})).data;
              const source = JSON.stringify(collected, null, 2) + '\n';
              const blob = (await github.rest.git.createBlob({owner, repo, content: source, encoding: 'utf-8'})).data;
              const tree = (await github.rest.git.createTree({owner, repo, base_tree: mainCommit.tree.sha,
                tree: [{path: 'agenda.json', mode: '100644', type: 'blob', sha: blob.sha}]})).data;
              const parents = [head];
              if (head !== mainSnapshot && (comparison.behind_by || 0) > 0) parents.push(mainSnapshot);
              const commit = (await github.rest.git.createCommit({owner, repo,
                message: 'Atualiza agenda de ' + date, tree: tree.sha, parents})).data;
              if (saoParts().date !== date) throw new Error('Virada de data antes de gravar branch; tentar novamente.');
              await github.rest.git.updateRef({owner, repo, ref: 'heads/' + branch, sha: commit.sha, force: false});
              const stored = (await github.rest.repos.getContent({owner, repo, path: 'agenda.json', ref: commit.sha})).data;
              if (canonicalAgenda(JSON.parse(Buffer.from(stored.content, 'base64').toString('utf8'))) !== canonicalAgenda(collected)) {
                throw new Error('Conteúdo da branch diverge da coleta.');
              }
              return (await github.rest.repos.getBranch({owner, repo, branch})).data;
            }

            let prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main',
              head: owner + ':' + branch, per_page: 100
            });

            if (prs.length === 0) {
              // Em workflow_run, o PR pode já ter sido encerrado por outra execução válida.
              // A recuperação abaixo é reservada aos ciclos de schedule/workflow_dispatch.
              if (context.eventName === 'workflow_run') {
                core.info('Nenhum PR aberto da agenda de ' + date + ' neste workflow_run.');
                return;
              }

              const previousPrs = await github.paginate(github.rest.pulls.list, {
                owner, repo, state: 'all', base: 'main',
                head: owner + ':' + branch, per_page: 100
              });
              for (const previous of previousPrs) {
                const details = (await github.rest.pulls.get({
                  owner, repo, pull_number: previous.number
                })).data;
                if (details.merged_at) {
                  throw new Error('PR #' + details.number + ' já foi mesclado, mas a agenda atual diverge da coleta; revisão necessária.');
                }
                if (details.state === 'closed') {
                  throw new Error(
                    'Existe PR #' + details.number + ' fechado sem merge para ' + branch +
                    '; recuperação automática interrompida.'
                  );
                }
              }

              prClient(); // Falhar antes da escrita se o secret não estiver configurado.
              await prepareDailyBranch();

              const comparison = (await github.rest.repos.compareCommits({
                owner, repo, base: 'main', head: branch
              })).data;
              const recoveryFiles = comparison.files || [];

              if ((comparison.ahead_by || 0) === 0) throw new Error('Branch diária sem alteração após preparação.');

              if (recoveryFiles.length !== 1 || recoveryFiles[0].filename !== 'agenda.json') {
                throw new Error(
                  'Recuperação recusada: a branch ' + branch +
                  ' não altera exclusivamente agenda.json.'
                );
              }

              if (!process.env.AGENDA_PR_TOKEN) {
                throw new Error(
                  'Recuperação de PR exige o secret AGENDA_PR_TOKEN com acesso somente a este repositório e Pull requests: write. ' +
                  'O GITHUB_TOKEN pode deixar o Agenda Guard aguardando aprovação humana.'
                );
              }
              const created = (await prClient().rest.pulls.create({
                owner, repo,
                head: branch,
                base: 'main',
                title: 'Atualiza agenda de ' + date,
                body:
                  'Agenda de ' + date + ' coletada diretamente da ESPN. As 13 competições foram consultadas com sucesso; ' +
                  'horários convertidos para America/Sao_Paulo. Somente agenda.json foi alterado. ' +
                  'Relatório: https://github.com/' + repoName + '/actions/runs/' + context.runId
              })).data;

              core.notice(
                'PR #' + created.number + ' recriado automaticamente para ' + branch +
                '; o Agenda Guard fará a validação antes de qualquer merge.'
              );
              core.info('PR criado; aguardando Agenda Guard. O workflow_run continuará a publicação após aprovação do check.');
              return;
            }
            if (prs.length !== 1) throw new Error('Há mais de um PR da agenda de ' + date + '.');

            const number = prs[0].number;
            let pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
            const sha = pr.head.sha;

            function checkPr(p) {
              if (p.state !== 'open' || p.draft ||
                  p.base.ref !== 'main' || p.head.ref !== branch ||
                  p.head.repo.full_name !== repoName ||
                  p.base.repo.full_name !== repoName || p.head.sha !== sha) {
                throw new Error('PR, branch, base ou SHA não corresponde à agenda esperada.');
              }
            }
            checkPr(pr);

            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100
            });
            if (changed.length !== 1 ||
                changed[0].filename !== 'agenda.json' ||
                changed[0].status !== 'modified') {
              throw new Error('A publicação exige alteração exclusiva de agenda.json.');
            }

            let guard = null;
            if (triggeringGuard &&
                triggeringGuard.head_sha === sha &&
                triggeringGuard.status === 'completed' &&
                triggeringGuard.conclusion === 'success' &&
                triggeringGuard.pull_requests.some(p => p.number === number)) {
              guard = triggeringGuard;
            } else {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner, repo, workflow_id: 'agenda-guard.yml',
                branch, event: 'pull_request', per_page: 100
              });
              guard = runs.find(r =>
                r.head_sha === sha && r.status === 'completed' &&
                r.conclusion === 'success' &&
                r.pull_requests.some(p => p.number === number)
              );
            }
            if (!guard) throw new Error('Agenda Guard não aprovado para o HEAD atual.');

            const response = await github.rest.repos.getContent({
              owner, repo, path: 'agenda.json', ref: sha
            });
            if (Array.isArray(response.data) || !response.data.content) {
              throw new Error('agenda.json não pode ser lido no HEAD do PR.');
            }
            const source = Buffer.from(response.data.content, 'base64').toString('utf8');
            const agenda = JSON.parse(source);
            if (!Array.isArray(agenda)) throw new Error('agenda.json deve ser uma lista.');
            if (canonicalAgenda(agenda) !== canonicalAgenda(collected)) {
              throw new Error('Agenda do PR diverge da coleta atual das 13 competições; merge recusado.');
            }

            let last = '';
            for (const entry of agenda) {
              if (!entry || typeof entry !== 'object' || Array.isArray(entry) ||
                  Object.keys(entry).sort().join(',') !== 'desc,time' ||
                  typeof entry.time !== 'string' ||
                  !/^(?:[01][0-9]|2[0-3]):[0-5][0-9]$/.test(entry.time) ||
                  typeof entry.desc !== 'string' || !entry.desc.trim() ||
                  entry.time < last) {
                throw new Error('Item de agenda inválido ou fora de ordem.');
              }
              last = entry.time;
            }

            const mainFile = await github.rest.repos.getContent({
              owner, repo, path: 'agenda.json', ref: 'main'
            });
            if (Array.isArray(mainFile.data)) {
              throw new Error('agenda.json da main não é um arquivo.');
            }

            let mainAgenda = null;
            try {
              mainAgenda = JSON.parse(
                Buffer.from(mainFile.data.content, 'base64').toString('utf8')
              );
            } catch (error) {
              core.info('agenda.json atual da main não é JSON válido; o PR deverá corrigi-lo.');
            }

            // Se a pesquisa de hoje resultar no mesmo conteúdo já publicado,
            // encerra o PR redundante para não deixar pendências antigas.
            if (canonicalAgenda(mainAgenda) === canonicalAgenda(agenda)) {
              await github.rest.pulls.update({
                owner, repo, pull_number: number, state: 'closed'
              });
              core.notice(
                'Agenda de ' + date + ' já estava correta na main; PR #' +
                number + ' encerrado sem merge redundante.'
              );
              return;
            }

            let ready = false;
            for (let attempt = 0; attempt < 10; attempt++) {
              pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
              checkPr(pr);

              if (pr.mergeable === true && pr.mergeable_state === 'clean') {
                ready = true;
                break;
              }
              if (pr.mergeable === false || ['dirty', 'blocked'].includes(pr.mergeable_state)) {
                throw new Error('GitHub bloqueou merge: ' + pr.mergeable_state);
              }

              await sleep(3000);
            }
            if (!ready) throw new Error('GitHub não confirmou mergeable=true / clean após novas consultas.');

            if (saoParts().date !== date) throw new Error('Data mudou antes do merge; publicação recusada.');
            const result = await github.rest.pulls.merge({
              owner, repo, pull_number: number, sha,
              merge_method: 'squash',
              commit_title: 'Atualiza agenda de ' + date + ' (#' + number + ')'
            });
            if (result.data.merged !== true) {
              throw new Error('GitHub não confirmou o merge do PR #' + number);
            }

            const updated = await github.rest.repos.getContent({
              owner, repo, path: 'agenda.json', ref: 'main'
            });
            const published = JSON.parse(
              Buffer.from(updated.data.content, 'base64').toString('utf8')
            );
            if (canonicalAgenda(published) !== canonicalAgenda(agenda)) {
              throw new Error('Merge feito, mas conteúdo da main diverge da agenda aprovada.');
            }

            core.notice(
              'Agenda de ' + date + ': ' + agenda.length + ' jogo(s); PR #' +
              number + '; merge ' + result.data.sha
            );

