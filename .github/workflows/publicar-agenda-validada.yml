name: Publicar agenda validada

on:
  workflow_run:
    workflows: ["Agenda Guard"]
    types: [completed]
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: publicar-agenda-main
  cancel-in-progress: false

jobs:
  publicar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir PR, Agenda Guard e publicar sem bypass
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const repoName = owner + '/' + repo;
            const parts = Object.fromEntries(
              new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/Sao_Paulo',
                year: 'numeric', month: '2-digit', day: '2-digit'
              }).formatToParts(new Date()).map(({type, value}) => [type, value])
            );
            const date = parts.year + '-' + parts.month + '-' + parts.day;
            const branch = 'agenda-auto-' + date;

            if (context.eventName === 'workflow_run') {
              const run = context.payload.workflow_run;
              if (run.event !== 'pull_request' ||
                  run.path !== '.github/workflows/agenda-guard.yml' ||
                  run.head_branch !== branch) {
                core.info('Evento não pertence à agenda de hoje. Nada a publicar.');
                return;
              }
            }

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main',
              head: owner + ':' + branch, per_page: 100
            });
            if (prs.length === 0) {
              core.info('Nenhum PR aberto da agenda de hoje. Nenhum arquivo alterado.');
              return;
            }
            if (prs.length !== 1) throw new Error('Há mais de um PR da agenda de hoje.');
            const number = prs[0].number;
            let pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
            const sha = pr.head.sha;

            function checkPr(p) {
              if (p.state !== 'open' || p.draft ||
                  p.base.ref !== 'main' || p.head.ref !== branch ||
                  p.head.repo.full_name !== repoName ||
                  p.base.repo.full_name !== repoName || p.head.sha !== sha) {
                throw new Error('PR, branch, base ou SHA não corresponde à agenda de hoje.');
              }
            }
            checkPr(pr);

            const changed = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: number, per_page: 100
            });
            if (changed.length !== 1 ||
                changed[0].filename !== 'agenda.json' ||
                changed[0].status !== 'modified') {
              throw new Error('A publicação exige alteração exclusiva de agenda.json.');
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'agenda-guard.yml',
              branch, event: 'pull_request', per_page: 100
            });
            const guard = runs.find(r =>
              r.head_sha === sha && r.status === 'completed' &&
              r.conclusion === 'success' &&
              r.pull_requests.some(p => p.number === number)
            );
            if (!guard) throw new Error('Agenda Guard não aprovado para HEAD atual.');
            if (context.eventName === 'workflow_run' &&
                context.payload.workflow_run.id !== guard.id) {
              core.info('Existe outra execução mais recente aprovada para este HEAD.');
            }

            const response = await github.rest.repos.getContent({
              owner, repo, path: 'agenda.json', ref: sha
            });
            if (Array.isArray(response.data) || !response.data.content) {
              throw new Error('agenda.json não pode ser lido no HEAD do PR.');
            }
            const source = Buffer.from(response.data.content, 'base64').toString('utf8');
            const agenda = JSON.parse(source);
            if (!Array.isArray(agenda)) throw new Error('agenda.json deve ser uma lista.');
            let last = '';
            for (const entry of agenda) {
              if (!entry || typeof entry !== 'object' || Array.isArray(entry) ||
                  Object.keys(entry).sort().join(',') !== 'desc,time' ||
                  typeof entry.time !== 'string' ||
                  !/^(?:[01][0-9]|2[0-3]):[0-5][0-9]$/.test(entry.time) ||
                  typeof entry.desc !== 'string' || !entry.desc.trim() ||
                  entry.time < last) {
                throw new Error('Item de agenda inválido ou fora de ordem.');
              }
              last = entry.time;
            }

            // Se o titular já publicou manualmente a mesma agenda, não faça merge redundante.
            const mainFile = await github.rest.repos.getContent({
              owner, repo, path: 'agenda.json', ref: 'main'
            });
            if (Array.isArray(mainFile.data)) {
              throw new Error('agenda.json da main não é um arquivo.');
            }
            let mainAgenda = null;
            try {
              mainAgenda = JSON.parse(
                Buffer.from(mainFile.data.content, 'base64').toString('utf8')
              );
            } catch (error) {
              core.info('agenda.json atual da main não é JSON válido; o PR deverá corrigi-lo.');
            }
            if (JSON.stringify(mainAgenda) === JSON.stringify(agenda)) {
              core.info('Agenda de hoje já está na main; PR não será mesclado.');
              return;
            }

            let ready = false;
            for (let attempt = 0; attempt < 4; attempt++) {
              pr = (await github.rest.pulls.get({owner, repo, pull_number: number})).data;
              checkPr(pr);
              if (pr.mergeable === true && pr.mergeable_state === 'clean') {
                ready = true;
                break;
              }
              if (pr.mergeable === false || ['dirty', 'blocked'].includes(pr.mergeable_state)) {
                throw new Error('GitHub bloqueou merge: ' + pr.mergeable_state);
              }
              await new Promise(resolve => setTimeout(resolve, 3000));
            }
            if (!ready) throw new Error('GitHub não confirmou mergeable=true / clean.');

            const result = await github.rest.pulls.merge({
              owner, repo, pull_number: number, sha,
              merge_method: 'squash',
              commit_title: 'Atualiza agenda de ' + date + ' (#' + number + ')'
            });
            if (result.data.merged !== true) {
              throw new Error('GitHub não confirmou o merge do PR #' + number);
            }

            const updated = await github.rest.repos.getContent({
              owner, repo, path: 'agenda.json', ref: 'main'
            });
            const published = JSON.parse(
              Buffer.from(updated.data.content, 'base64').toString('utf8')
            );
            if (JSON.stringify(published) !== JSON.stringify(agenda)) {
              throw new Error('Merge feito, mas conteúdo da main diverge da agenda aprovada.');
            }
            core.notice(
              'Agenda de ' + date + ': ' + agenda.length + ' jogo(s); PR #' +
              number + '; merge ' + result.data.sha
            );
