name: Pré-jogo — teste editorial temporário sem APIs
on:
  push:
    branches: [main]
    paths: [.github/workflows/pre-jogo-editorial-temp.yml]
permissions:
  contents: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compilar regras e testar contrato editorial sem custo
        run: |
          set -euo pipefail
          python -m py_compile scripts/montar_pacote_editorial.py scripts/validar_rascunho_pre_jogo.py scripts/preparar_redacao_pre_jogo.py scripts/redigir_pre_jogo_openai.py
          python tests/pre-jogo/teste_modelo_editorial_aprovado.py
          python tests/pre-jogo/teste_estadio_fixo_mandante.py
          python tests/pre-jogo/teste_passo34_automatico.py
          python tests/pre-jogo/teste_pesquisa_gratuita.py
