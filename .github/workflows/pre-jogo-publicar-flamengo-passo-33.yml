name: Pré-jogo — PUBLICAR Flamengo x Del Valle (Passo 33)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo do Passo 33"
        required: true
        default: preflight_only
        type: choice
        options:
          - preflight_only
          - publish_main
      confirmation:
        description: "Para publish_main, digite exatamente: PUBLICAR FLAMENGO X DEL VALLE"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: pre-jogo-publicacao-main
  cancel-in-progress: false

env:
  SLUG: flamengo-independiente-del-valle-libertadores-2026-transmissao-horario-escalacoes.html
  CONTRACT_REPO: tests/pre-jogo/real/contrato-flamengo-independiente-del-valle-2026-09-17.json
  EVIDENCE_REPO: tests/pre-jogo/real/evidencias-flamengo-independiente-del-valle-2026-09-17.json
  SOURCE_ROOT: build/pre-jogo/source-step32
  FINAL_STATUS_REPORT: build/pre-jogo/passo-33-status-final.json
  PREFLIGHT_REPORT: build/pre-jogo/passo-33-preflight.json
  PUBLICATION_REPORT: build/pre-jogo/passo-33-publicacao.json

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar main sem credencial persistente
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar estrutura e modo do Passo 33
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/validar_status_final_pre_jogo.py \
            scripts/preflight_publicacao_pre_jogo.py \
            tests/pre-jogo/teste_status_final_pre_jogo.py
          python tests/pre-jogo/teste_status_final_pre_jogo.py

          case "${{ inputs.mode }}" in
            preflight_only|publish_main) ;;
            *) echo "ERRO: modo inválido."; exit 1 ;;
          esac

          if [ "${{ inputs.mode }}" = "publish_main" ] && \
             [ "${{ inputs.confirmation }}" != "PUBLICAR FLAMENGO X DEL VALLE" ]; then
            echo "ERRO: confirmação de publicação não corresponde à frase exigida."
            exit 1
          fi

          test "$(git rev-parse --abbrev-ref HEAD)" = "main"
          test -f "${CONTRACT_REPO}"
          test -f "${EVIDENCE_REPO}"
          echo "OK: estrutura do Passo 33 validada."

      - name: Localizar último Passo 32 aprovado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "${SOURCE_ROOT}"
          mkdir -p "${SOURCE_ROOT}"

          FOUND=""
          RUN_IDS=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pre-jogo-teste-real-flamengo.yml/runs" \
            -f branch=main \
            -f status=success \
            -f event=workflow_dispatch \
            -f per_page=20 \
            --jq '.workflow_runs[].id')

          for RUN_ID in ${RUN_IDS}; do
            ARTIFACT_COUNT=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "pre-jogo-teste-real-flamengo-passo-32")] | length')
            if [ "${ARTIFACT_COUNT}" = "1" ]; then
              echo "Usando Passo 32 aprovado da execução ${RUN_ID}."
              gh run download "${RUN_ID}" \
                --repo "${GITHUB_REPOSITORY}" \
                --name pre-jogo-teste-real-flamengo-passo-32 \
                --dir "${SOURCE_ROOT}"
              echo "${RUN_ID}" > "${SOURCE_ROOT}/source-run-id.txt"
              FOUND="${RUN_ID}"
              break
            fi
          done

          if [ -z "${FOUND}" ]; then
            echo "ERRO: nenhum artifact aprovado do Passo 32 foi encontrado."
            exit 1
          fi

          PACKAGE_MANIFEST=$(find "${SOURCE_ROOT}" -type f -path '*/publication-package/manifest.json' -print -quit)
          SOURCE_CONTRACT=$(find "${SOURCE_ROOT}" -type f -name 'contrato-flamengo-independiente-del-valle-2026-09-17.json' -print -quit)
          SOURCE_EVIDENCE=$(find "${SOURCE_ROOT}" -type f -name 'evidencias-flamengo-independiente-del-valle-2026-09-17.json' -print -quit)
          SOURCE_PREFLIGHT=$(find "${SOURCE_ROOT}" -type f -name 'passo-32-preflight.json' -print -quit)

          test -n "${PACKAGE_MANIFEST}"
          test -n "${SOURCE_CONTRACT}"
          test -n "${SOURCE_EVIDENCE}"
          test -n "${SOURCE_PREFLIGHT}"

          PACKAGE_DIR=$(dirname "${PACKAGE_MANIFEST}")
          {
            echo "PACKAGE_DIR=${PACKAGE_DIR}"
            echo "SOURCE_CONTRACT=${SOURCE_CONTRACT}"
            echo "SOURCE_EVIDENCE=${SOURCE_EVIDENCE}"
            echo "SOURCE_PREFLIGHT=${SOURCE_PREFLIGHT}"
            echo "STEP32_RUN_ID=${FOUND}"
          } >> "${GITHUB_ENV}"

      - name: Confirmar que o artifact é exatamente o aprovado
        shell: bash
        run: |
          set -euo pipefail
          cmp --silent "${CONTRACT_REPO}" "${SOURCE_CONTRACT}" || {
            echo "ERRO: contrato do artifact diverge do contrato versionado."; exit 1;
          }
          cmp --silent "${EVIDENCE_REPO}" "${SOURCE_EVIDENCE}" || {
            echo "ERRO: evidências do artifact divergem do snapshot versionado."; exit 1;
          }

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          slug = os.environ['SLUG']
          package = Path(os.environ['PACKAGE_DIR'])
          preflight = json.loads(Path(os.environ['SOURCE_PREFLIGHT']).read_text(encoding='utf-8'))
          manifest = json.loads((package / 'manifest.json').read_text(encoding='utf-8'))

          if preflight.get('publication_gate_reached') is not True:
              raise SystemExit('ERRO: artifact do Passo 32 não alcançou a porta final.')
          if preflight.get('package_matches_current_main') is not True:
              raise SystemExit('ERRO: Passo 32 não aprovou compatibilidade do pacote.')
          if preflight.get('changed_file_count') != 3:
              raise SystemExit('ERRO: Passo 32 não aprovou exatamente três alterações.')
          if any(preflight.get(key) is not False for key in ('commit_created', 'push_executed', 'main_published')):
              raise SystemExit('ERRO: artifact indica publicação anterior indevida.')

          if manifest.get('step') != 28 or manifest.get('slug') != slug:
              raise SystemExit('ERRO: manifest não pertence à matéria real esperada.')
          if manifest.get('prepared_change_count') != 3:
              raise SystemExit('ERRO: pacote não contém exatamente três alterações.')
          targets = [item.get('target') for item in manifest.get('prepared_changes', [])]
          if targets != [slug, 'noticias.json', 'sitemap.xml']:
              raise SystemExit(f'ERRO: escopo inesperado no pacote: {targets}')

          print(f'OK: artifact do Passo 32 #{os.environ["STEP32_RUN_ID"]} autenticado pelo conteúdo.')
          PY

      - name: Verificar Secret do check oficial final
        shell: bash
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERPER_API_KEY}" ]; then
            echo "ERRO: SERPER_API_KEY não está configurado."
            exit 1
          fi
          echo "SERPER_API_KEY encontrado. O valor não será exibido."

      - name: Revalidar status em fonte oficial
        shell: bash
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -euo pipefail
          python scripts/validar_status_final_pre_jogo.py \
            --evidence "${SOURCE_EVIDENCE}" \
            --report "${FINAL_STATUS_REPORT}" \
            --execute

      - name: Reexecutar preflight contra a main atual
        shell: bash
        run: |
          set -euo pipefail
          python scripts/preflight_publicacao_pre_jogo.py \
            --package-dir "${PACKAGE_DIR}" \
            --report "${PREFLIGHT_REPORT}"

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('build/pre-jogo/passo-33-preflight.json').read_text(encoding='utf-8'))
          required = {
              'publication_gate_reached': True,
              'package_matches_current_main': True,
              'changed_file_count': 3,
              'commit_created': False,
              'push_executed': False,
              'main_published': False,
              'checkout_restored_clean': True,
          }
          failed = [key for key, expected in required.items() if report.get(key) != expected]
          if failed:
              raise SystemExit('ERRO: preflight final falhou em: ' + ', '.join(failed))
          print('OK: pacote continua compatível com a main atual.')
          PY

      - name: Encerrar em preflight sem publicar
        if: ${{ inputs.mode == 'preflight_only' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = {
              'step': 33,
              'mode': 'preflight_only',
              'slug': os.environ['SLUG'],
              'source_step32_run_id': os.environ['STEP32_RUN_ID'],
              'final_official_status_passed': True,
              'preflight_passed': True,
              'commit_created': False,
              'push_executed': False,
              'main_published': False,
          }
          Path('build/pre-jogo/passo-33-publicacao.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('PASSO 33 — PREFLIGHT APROVADO')
          print('Publicação executada: não')
          print('Para publicar, execute novamente com mode=publish_main no dia da partida após 00:01.')
          PY

      - name: Validar janela de publicação real
        if: ${{ inputs.mode == 'publish_main' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo('America/Sao_Paulo'))
          expected_date = datetime(2026, 9, 17).date()
          if now.date() != expected_date:
              raise SystemExit(
                  f'ERRO: publicação real só é permitida em 17/09/2026. Agora: {now:%d/%m/%Y %H:%M:%S %Z}'
              )
          if now.time() < time(0, 1):
              raise SystemExit('ERRO: publicação bloqueada antes de 00:01 no horário de Brasília.')
          if now.time() >= time(21, 30):
              raise SystemExit('ERRO: publicação de pré-jogo bloqueada a partir do horário de início da partida.')
          print(f'OK: janela de publicação válida. Agora: {now:%d/%m/%Y %H:%M:%S %Z}')
          PY

      - name: Confirmar que a main remota não mudou
        if: ${{ inputs.mode == 'publish_main' }}
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_MAIN=$(git rev-parse HEAD)
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test -n "${REMOTE_MAIN}"
          if [ "${REMOTE_MAIN}" != "${LOCAL_MAIN}" ]; then
            echo "ERRO: main remota mudou depois do preflight."
            echo "Local:  ${LOCAL_MAIN}"
            echo "Remota: ${REMOTE_MAIN}"
            exit 1
          fi
          echo "BASE_MAIN_SHA=${LOCAL_MAIN}" >> "${GITHUB_ENV}"
          echo "Main remota congelada para a publicação: ${LOCAL_MAIN}"

      - name: Aplicar exatamente os três arquivos e criar commit
        if: ${{ inputs.mode == 'publish_main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp "${PACKAGE_DIR}/${SLUG}" "${SLUG}"
          cp "${PACKAGE_DIR}/noticias.json" noticias.json
          cp "${PACKAGE_DIR}/sitemap.xml" sitemap.xml

          python - <<'PY'
          import os
          import subprocess

          slug = os.environ['SLUG']
          expected = {slug: 'A', 'noticias.json': 'M', 'sitemap.xml': 'M'}

          modified = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()))
          untracked = set(filter(None, subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()))
          observed = modified | untracked
          if observed != set(expected):
              raise SystemExit(f'ERRO: aplicação alterou escopo inesperado: {sorted(observed)}')
          PY

          git add -- "${SLUG}" noticias.json sitemap.xml
          git diff --cached --check

          python - <<'PY'
          import os
          import subprocess

          slug = os.environ['SLUG']
          lines = subprocess.check_output(['git', 'diff', '--cached', '--name-status'], text=True).splitlines()
          actual = {}
          for line in lines:
              status, name = line.split('\t', 1)
              actual[name] = status
          expected = {slug: 'A', 'noticias.json': 'M', 'sitemap.xml': 'M'}
          if actual != expected:
              raise SystemExit(f'ERRO: stage final inesperado: {actual}')
          if len(lines) != 3:
              raise SystemExit(f'ERRO: stage final tem {len(lines)} arquivos; esperado 3.')
          print('OK: stage contém somente A/M/M nos três arquivos permitidos.')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publica pré-jogo Flamengo x Independiente del Valle"
          echo "PUBLICATION_COMMIT_SHA=$(git rev-parse HEAD)" >> "${GITHUB_ENV}"

      - name: Instalar trava de pre-push exclusiva para main e para os 3 arquivos
        if: ${{ inputs.mode == 'publish_main' }}
        shell: bash
        run: |
          set -euo pipefail
          cat > .git/hooks/pre-push <<'HOOK'
          #!/usr/bin/env bash
          set -euo pipefail
          expected_slug="flamengo-independiente-del-valle-libertadores-2026-transmissao-horario-escalacoes.html"
          while read -r local_ref local_sha remote_ref remote_sha; do
            [ -n "$remote_ref" ] || continue
            if [ "$remote_ref" != "refs/heads/main" ]; then
              echo "ERRO: Passo 33 bloqueou destino diferente de main: $remote_ref" >&2
              exit 1
            fi
            mapfile -t names < <(git diff --name-only "$remote_sha" "$local_sha")
            if [ "${#names[@]}" -ne 3 ]; then
              echo "ERRO: push teria ${#names[@]} arquivos; esperado 3." >&2
              exit 1
            fi
            printf '%s\n' "${names[@]}" | sort > /tmp/observed-files.txt
            printf '%s\n' "$expected_slug" noticias.json sitemap.xml | sort > /tmp/expected-files.txt
            if ! cmp -s /tmp/observed-files.txt /tmp/expected-files.txt; then
              echo "ERRO: arquivos do push divergem do escopo permitido." >&2
              cat /tmp/observed-files.txt >&2
              exit 1
            fi
          done
          HOOK
          chmod +x .git/hooks/pre-push
          echo "Pre-push instalado: somente main + exatamente 3 arquivos."

      - name: Reconfirmar main e publicar
        if: ${{ inputs.mode == 'publish_main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "${REMOTE_MAIN}" != "${BASE_MAIN_SHA}" ]; then
            echo "ERRO: main remota mudou imediatamente antes do push."
            exit 1
          fi

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main

          AFTER=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "${AFTER}" != "${PUBLICATION_COMMIT_SHA}" ]; then
            echo "ERRO: SHA remoto após push diverge do commit publicado."
            echo "Esperado: ${PUBLICATION_COMMIT_SHA}"
            echo "Remoto:   ${AFTER}"
            exit 1
          fi
          echo "OK: commit de publicação chegou à main."

      - name: Verificar o commit publicado diretamente no GitHub
        if: ${{ inputs.mode == 'publish_main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/commits/${PUBLICATION_COMMIT_SHA}" \
            > build/pre-jogo/passo-33-commit-remoto.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('build/pre-jogo/passo-33-commit-remoto.json').read_text(encoding='utf-8'))
          slug = os.environ['SLUG']
          observed = {item['filename']: item['status'] for item in data.get('files', [])}
          expected = {slug: 'added', 'noticias.json': 'modified', 'sitemap.xml': 'modified'}
          if observed != expected:
              raise SystemExit(f'ERRO: GitHub confirmou diff remoto inesperado: {observed}')
          if data.get('sha') != os.environ['PUBLICATION_COMMIT_SHA']:
              raise SystemExit('ERRO: GitHub devolveu SHA diferente do commit publicado.')
          print('OK: GitHub confirmou exatamente os três arquivos publicados.')
          PY

      - name: Acionar noticias-home e IndexNow explicitamente
        if: ${{ inputs.mode == 'publish_main' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Pushes feitos com GITHUB_TOKEN não devem depender de novos eventos de push.
          # Por isso acionamos explicitamente os dois workflows já existentes.
          HOME_OK=true
          INDEX_OK=true

          if ! gh workflow run atualizar-noticias-home.yml --repo "${GITHUB_REPOSITORY}" --ref main; then
            HOME_OK=false
            echo "::warning::Não foi possível despachar Atualizar noticias-home."
          fi

          if ! gh workflow run indexnow.yml --repo "${GITHUB_REPOSITORY}" --ref main -f "file=${SLUG}"; then
            INDEX_OK=false
            echo "::warning::Não foi possível despachar IndexNow para ${SLUG}."
          fi

          echo "HOME_DISPATCH_OK=${HOME_OK}" >> "${GITHUB_ENV}"
          echo "INDEXNOW_DISPATCH_OK=${INDEX_OK}" >> "${GITHUB_ENV}"

      - name: Gerar relatório final do Passo 33
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          mode = '${{ inputs.mode }}'
          published = mode == 'publish_main' and bool(os.environ.get('PUBLICATION_COMMIT_SHA'))
          report = {
              'step': 33,
              'mode': mode,
              'slug': os.environ['SLUG'],
              'source_step32_run_id': os.environ.get('STEP32_RUN_ID'),
              'final_status_report_exists': Path(os.environ['FINAL_STATUS_REPORT']).exists(),
              'preflight_report_exists': Path(os.environ['PREFLIGHT_REPORT']).exists(),
              'base_main_sha': os.environ.get('BASE_MAIN_SHA'),
              'publication_commit_sha': os.environ.get('PUBLICATION_COMMIT_SHA'),
              'commit_created': published,
              'push_executed': published,
              'main_published': published,
              'published_file_count': 3 if published else 0,
              'noticias_home_dispatch_ok': os.environ.get('HOME_DISPATCH_OK'),
              'indexnow_dispatch_ok': os.environ.get('INDEXNOW_DISPATCH_OK'),
          }
          Path(os.environ['PUBLICATION_REPORT']).parent.mkdir(parents=True, exist_ok=True)
          Path(os.environ['PUBLICATION_REPORT']).write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print('PASSO 33 — RELATÓRIO FINAL')
          print(f'Modo: {mode}')
          print(f'Publicação na main: {published}')
          if published:
              print(f'Commit: {os.environ.get("PUBLICATION_COMMIT_SHA")}')
              print('Arquivos do commit: 3')
          PY

      - name: Guardar auditoria do Passo 33
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pre-jogo-passo-33-${{ inputs.mode }}
          path: |
            build/pre-jogo/passo-33-status-final.json
            build/pre-jogo/passo-33-preflight.json
            build/pre-jogo/passo-33-publicacao.json
            build/pre-jogo/passo-33-commit-remoto.json
            build/pre-jogo/source-step32/source-run-id.txt
          if-no-files-found: warn
          retention-days: 7
