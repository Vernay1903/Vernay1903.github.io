name: Passo 34 — finalização automática temporária
# tentativa automática 2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/passo34-finalizacao-temporaria.yml"

permissions:
  contents: read
  actions: write

jobs:
  validar-passo-34:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Disparar prepare_dry_run real
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          START_EPOCH=$(date -u +%s)
          gh workflow run pre-jogo-automatico.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f mode=prepare_dry_run \
            -f target_date=2026-09-18

          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/pre-jogo-automatico.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs | map(select(.head_sha == \"${GITHUB_SHA}\")) | .[0].id // empty")
            [ -n "${RUN_ID}" ] && break
            sleep 4
          done
          if [ -z "${RUN_ID}" ]; then
            echo "ERRO: não foi possível localizar o run filho do Passo 34."
            exit 1
          fi
          echo "CHILD_RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"
          echo "Run filho: ${RUN_ID}"

      - name: Aguardar preparo terminar
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}" --jq '.status')
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CHILD_RUN_ID}" --jq '.conclusion // ""')
            echo "status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${STATUS}" = "completed" ]; then
              [ "${CONCLUSION}" = "success" ] || exit 1
              exit 0
            fi
            sleep 5
          done
          echo "ERRO: timeout aguardando o Passo 34."
          exit 1

      - name: Validar resultado editorial do artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/passo34-final
          mkdir -p /tmp/passo34-final
          gh run download "${CHILD_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "pre-jogo-preparado-2026-09-18" \
            --dir /tmp/passo34-final
          MANIFEST=$(find /tmp/passo34-final -type f -name manifest.json -print -quit)
          [ -n "${MANIFEST}" ] || { echo "ERRO: manifest.json ausente"; exit 1; }
          python - "${MANIFEST}" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert data.get("target_date") == "2026-09-18", data
          assert data.get("prepared_count") == 1, data
          assert data.get("skipped_count") == 0, data
          assert data.get("publication_unlocked") is False, data
          assert len(data.get("articles", [])) == 1, data
          print("PASSO 34 FINALIZADO: 1 matéria pronta, 0 bloqueadas, nenhuma publicação.")
          PY
