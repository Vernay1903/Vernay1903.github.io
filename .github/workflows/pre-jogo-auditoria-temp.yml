name: Pré-jogo auditoria completa temporária sem APIs
on:
  push:
    branches: [main]
    paths: [.github/workflows/pre-jogo-auditoria-temp.yml]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CDE_FREE_RESEARCH: "1"
      CDE_DISABLE_PAID_FACT_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar mesmos testes do agendamento e dos dias vazios sem custos
        run: |
          set -euo pipefail
          python -m py_compile scripts/*.py
          python -m json.tool config/pre-jogo.json >/dev/null
          python tests/pre-jogo/teste_dia_sem_jogos.py
          python tests/pre-jogo/teste_recuperar_preparo.py
          python tests/pre-jogo/teste_passo34_automatico.py
          python tests/pre-jogo/teste_passo34_8.py
          python tests/pre-jogo/teste_passo34_9.py
          python tests/pre-jogo/teste_passo34_10.py
          python tests/pre-jogo/teste_passo34_11.py
          python tests/pre-jogo/teste_preview_html.py
          python tests/pre-jogo/teste_serper_economia.py
          python tests/pre-jogo/teste_pesquisa_gratuita.py
          python tests/pre-jogo/teste_aliases_adversarios.py
          python tests/pre-jogo/teste_reuso_opcionais.py
          python tests/pre-jogo/teste_estadios_aliases.py
          python tests/pre-jogo/teste_estadio_fixo_mandante.py
          python tests/pre-jogo/teste_modelo_editorial_aprovado.py
          python tests/pre-jogo/teste_profundo_coleta_gratuita.py
          python tests/pre-jogo/teste_rss_consulta_curta.py
          python tests/pre-jogo/teste_reuso_fontes_gratuitas.py
          python tests/pre-jogo/teste_status_final_football_data.py
          python tests/pre-jogo/teste_enriquecer_fatos_football_data.py
          echo 'OK: auditoria offline integral passou; nenhuma chamada à OpenAI/Serper.'
