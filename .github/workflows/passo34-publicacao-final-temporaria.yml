name: Passo 34 — validação final de publicação temporária

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/passo34-publicacao-final-temporaria.yml"

permissions:
  contents: read
  actions: write

jobs:
  validar-publicacao:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_DATE: "2026-09-18"
      SLUG: "bayern-de-munique-1-fc-union-berlin-bundesliga-2026-transmissao-horario-escalacoes.html"

    steps:
      - name: Disparar publicação dry-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pre-jogo-automatico.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f mode=publish_dry_run \
            -f target_date="${TARGET_DATE}"

          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/pre-jogo-automatico.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
              --jq ".workflow_runs | map(select(.head_sha == \"${GITHUB_SHA}\" and .status != \"completed\")) | .[0].id // empty")
            [ -n "${RUN_ID}" ] && break
            sleep 4
          done
          [ -n "${RUN_ID}" ] || { echo "ERRO: dry-run não localizado."; exit 1; }
          echo "PUB_RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"
          echo "Publicação dry-run: ${RUN_ID}"

      - name: Aguardar publicação dry-run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            STATUS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUB_RUN_ID}" --jq '.status')
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PUB_RUN_ID}" --jq '.conclusion // ""')
            echo "status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${STATUS}" = "completed" ]; then
              [ "${CONCLUSION}" = "success" ] || exit 1
              exit 0
            fi
            sleep 5
          done
          echo "ERRO: timeout no dry-run."
          exit 1

      - name: Validar auditoria final sem push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/passo34-pub
          mkdir -p /tmp/passo34-pub
          gh run download "${PUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "pre-jogo-passo-34-publicacao-dry-run-${TARGET_DATE}" \
            --dir /tmp/passo34-pub

          REPORT=$(find /tmp/passo34-pub -type f -name automatico-publicacao.json -print -quit)
          APPROVED=$(find /tmp/passo34-pub -type f -name automatico-approved.txt -print -quit)
          [ -n "${REPORT}" ] || { echo "ERRO: relatório ausente."; exit 1; }
          [ -n "${APPROVED}" ] || { echo "ERRO: aprovados ausente."; exit 1; }

          python - "${REPORT}" "${APPROVED}" <<'PY'
          import json, sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          approved = [
              x.strip()
              for x in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
              if x.strip()
          ]
          slug = "bayern-de-munique-1-fc-union-berlin-bundesliga-2026-transmissao-horario-escalacoes.html"

          assert approved == [slug], approved
          assert report.get("changed_file_count") == 3, report
          assert set(report.get("changed_files", [])) == {
              slug,
              "noticias.json",
              "sitemap.xml",
          }, report
          print("PASSO 34 FINALIZADO END-TO-END: 1 matéria aprovada, 3 arquivos exatos, 0 push.")
          PY
