name: Pré-jogo — teste temporário team data gratuito
on:
  push:
    branches: [main]
    paths: [.github/workflows/pre-jogo-team-data-temp.yml]
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar venue e coach sem custo e sem publicação
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          set -euo pipefail
          TARGET=2026-09-20
          python scripts/buscar_fixtures_football_data.py --date "$TARGET" --force
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib.request import Request, urlopen
          data=json.loads(Path("build/pre-jogo/fixtures-normalizados.json").read_text())
          token=os.environ["FOOTBALL_DATA_TOKEN"]
          seen=set()
          for f in data["fixtures"]:
              for side in ("home_team_id","away_team_id"):
                  tid=f["provider_data"].get(side)
                  if not tid or tid in seen: continue
                  seen.add(tid)
                  time.sleep(6.2 if len(seen)>1 else 0)
                  req=Request(f"https://api.football-data.org/v4/teams/{tid}",
                              headers={"X-Auth-Token":token,"Accept":"application/json"})
                  with urlopen(req,timeout=20) as r:
                      d=json.loads(r.read().decode())
                  coach=d.get("coach") or {}
                  print("TEAM",tid,d.get("name"),"venue=",d.get("venue"),
                        "address=",d.get("address"),"coach=",coach.get("name"))
          PY
