name: Pós-jogo — validação final com modelo reforçado (passo 20)
# Ensaio único sob saldo residual do teto de US$ 0,10; sem publicação.
# Correção sintática no script antes da primeira chamada faturável.
on:
  push:
    branches: [main]
    paths: [.github/workflows/pos-jogo-validacao-final-modelo20.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: pos-jogo-estado-piloto
  cancel-in-progress: false
jobs:
  revisar:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Executar ensaio final do passo 20 com modelo forte' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Carregar pipeline de apuração, revisão e HTML validado
        uses: actions/checkout@v4
        with:
          ref: c63010e7fbc4bdcadb5c69f290e949dd047ef601
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /config/
            /templates/
            /prompts/
            /tests/pos-jogo/
            /auditoria/pos-jogo/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes de regressão
        run: python -m unittest discover -s tests/pos-jogo -p 'test_*.py'
      - name: Ler destinos atuais sem modificar o site
        uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /noticias.json
            /sitemap.xml
            /*.html
      - name: Obter rotina corrigida
        uses: actions/checkout@v4
        with:
          ref: main
          path: final-code
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/finalizar_passo20_modelo_forte.py
      - name: Recuperar artigo e parecer do último ensaio
        uses: actions/download-artifact@v4
        with:
          name: pos-jogo-passo20-final-41484419472
          run-id: 41484419472
          github-token: ${{ github.token }}
          path: build/pos-jogo/passo20-failed
      - name: Validar artefato e parecer arquivado
        run: |
          test -f build/pos-jogo/passo20-failed/redacao/artigo.json
          test -f build/pos-jogo/passo20-failed/redacao/revisao-4.json
          test -f build/pos-jogo/passo20-failed/pacote.json
      - name: Corrigir unidades reprovadas e revisar duas vezes
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python final-code/scripts/finalizar_passo20_modelo_forte.py
      - name: Preservar pacote e trilha de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-jogo-passo20-modelo-forte-${{ github.run_id }}
          path: build/pos-jogo/passo20-conclusao/
          retention-days: 30
          if-no-files-found: warn
      - name: Confirmar que nenhuma matéria foi publicada
        if: always()
        run: |
          git diff --exit-code
          if [ -d current-main/.git ]; then git -C current-main diff --exit-code; fi
