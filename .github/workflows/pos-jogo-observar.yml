name: Pós-jogo — observar término real e persistir
on:
  push:
    branches: [piloto-pos-jogo-quatro-clubes]
    paths: [.github/workflows/pos-jogo-observar.yml]
permissions:
  contents: write
concurrency:
  group: pos-jogo-estado-piloto
  cancel-in-progress: false
jobs:
  observar:
    if: "github.event.head_commit.message == 'Passo 12: observar partidas recentes'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: main
          path: current-main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar partidas sem API paga e salvar estado separado
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/estado_operacao_pos_jogo.py --site-root current-main --output build/pos-jogo/observacao-passo12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pos-jogo-observacao-${{ github.run_id }}
          path: build/pos-jogo/observacao-passo12/
          retention-days: 7
