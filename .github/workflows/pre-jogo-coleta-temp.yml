name: Pré-jogo — teste coleta gratuita temporário # técnicos adjacentes
on:
  push:
    branches: [main]
    paths: [.github/workflows/pre-jogo-coleta-temp.yml]
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar coleta e regras sem APIs
        run: |
          set -euo pipefail
          python -m py_compile scripts/enriquecer_fatos_football_data.py scripts/buscar_fontes_serper.py scripts/ler_fontes_candidatas_base.py scripts/extrair_fatos_estruturados.py
          python tests/pre-jogo/teste_profundo_coleta_gratuita.py
          python tests/pre-jogo/teste_modelo_editorial_aprovado.py
          python tests/pre-jogo/teste_enriquecer_fatos_football_data.py
          python tests/pre-jogo/teste_reuso_fontes_gratuitas.py
          python tests/pre-jogo/teste_pesquisa_gratuita.py
