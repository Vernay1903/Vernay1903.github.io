name: Instagram - diagnostico de acesso
on:
  push:
    branches: [main]
    paths:
      - 'scripts/instagram/verify_account.py'
      - '.github/workflows/instagram-access-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/instagram/
      - name: Consultar identidade sem publicar e sem revelar token
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: python scripts/instagram/verify_account.py
