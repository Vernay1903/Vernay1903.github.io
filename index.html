/* share.css */

/* ===== COMPARTILHAR ===== */
.share-wrap{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  margin:6px 0 14px;
}

.share-btn{
  border:1px solid #1E4BA5;
  background:#FFFFFF;
  color:#1E4BA5;
  font-weight:700;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
  font-size:14px;
}

.share-btn:hover{
  background:#1E4BA5;
  color:#FFFFFF;
}

.share-msg{
  font-size:12px;
  color:#5B6B84;
}


/* ===== BUSCA DO SITE ===== */

.site-search{
  flex:1 1 360px;
  max-width:430px;
  min-width:320px;
  display:flex;
  align-items:center;
  gap:8px;
  margin:0;
}

.site-search-label{
  position:absolute;
  width:1px;
  height:1px;
  padding:0;
  margin:-1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap;
  border:0;
}

.site-search-input{
  flex:1;
  min-width:0;
  height:44px;
  padding:0 13px;
  border:1px solid #1E4BA5;
  border-radius:10px;
  background:#FFFFFF;
  color:#0A1E3A;
  font:inherit;
  font-size:14px;
  outline:none;
}
